[project]
name = "comfyui-logblaster"
version = "1.1.4"
description = "Real-time Audio-Reactive WebGL2 GPU Shader Log-Text Visualizer & Auto-Popup HUD for ComfyUI — giant foreground streaming logs tapering into a 3D trail, 4 shaders, Comfy Black & Yellow palette, zero pip dependencies, and 0 MB extra PyTorch VRAM."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "Jeffrey Brick", email = "jbrick2070@gmail.com"},
]
keywords = [
    "comfyui",
    "comfyui-nodes",
    "comfyui-custom-node",
    "logs",
    "console",
    "terminal",
    "hud",
    "webgl2",
    "glsl",
    "shaders",
    "audio-reactive",
    "telemetry",
    "nvml",
    "visualizer",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    # NO ACCELERATOR CLASSIFIER, ON PURPOSE (2026-11-19, the rule OTR adopted
    # 2026-10-30). The ComfyUI frontend's Manager compares the machine's short
    # device name ("CUDA", "Metal", "ROCm", "CPU") against the registry's
    # strings ("GPU :: NVIDIA CUDA") as an exact match -- frontend issue 15364,
    # fix PR 15468 unmerged, 1.59 has the bug -- so any declared accelerator
    # marked LogBlaster "Conflicting" on every machine, NVIDIA included. An
    # empty list is unrestricted. LogBlaster needs no GPU at all (a browser
    # HUD; telemetry reads NVML on NVIDIA and IOKit on Apple Silicon). Put the
    # NVIDIA CUDA and Apple Metal classifiers back the day that fix ships.
]

[project.urls]
Homepage = "https://github.com/jbrick2070/ComfyUI-LogBlaster"
Repository = "https://github.com/jbrick2070/ComfyUI-LogBlaster"
Issues = "https://github.com/jbrick2070/ComfyUI-LogBlaster/issues"
Documentation = "https://github.com/jbrick2070/ComfyUI-LogBlaster#readme"

[tool.comfy]
PublisherId = "fluxus"
DisplayName = "LogBlaster"
Icon = "https://raw.githubusercontent.com/jbrick2070/ComfyUI-LogBlaster/main/assets/logblaster_icon_400.png"
Banner = "https://raw.githubusercontent.com/jbrick2070/ComfyUI-LogBlaster/main/assets/logblaster_banner.jpg"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
