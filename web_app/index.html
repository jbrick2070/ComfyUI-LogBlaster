  function wrapSpansMonospace(spans, maxCols, maxRows) {
    let totalLen = 0;
    for (let i = 0; i < spans.length; i++) {
      totalLen += spans[i].text ? spans[i].text.length : 0;
    }
    if (totalLen === 0) return [[]];
    if (totalLen <= maxCols && maxRows >= 1) return [spans];

    const plain = spans.map((s) => s.text || "").join("");
    const safeCols = Math.max(12, maxCols);
    const intervals = [];
    let pos = 0;

    while (pos < plain.length && intervals.length < maxRows) {
      const rem = plain.length - pos;
      if (rem <= safeCols) {
        intervals.push([pos, plain.length, false]);
        break;
      }
      if (intervals.length === maxRows - 1) {
        intervals.push([pos, pos + Math.max(1, safeCols - 1), true]);
        break;
      }
      // Prevent 1..7 character orphan tails (e.g. a lone "===") by pulling search window back 8 cols
      let searchMax = pos + safeCols;
      if (rem > safeCols && rem <= safeCols + 7 && safeCols > 24) {
        searchMax = pos + safeCols - 8;
      }
      let splitAt = searchMax;
      const minBreak = pos + Math.floor(safeCols * 0.52);
      for (let k = searchMax; k >= minBreak; k--) {
        const ch = plain[k - 1];
        if (ch === " " || ch === "/" || ch === "\\" || ch === "|" || ch === "-" || ch === ":" || ch === "]" || ch === ",") {
          splitAt = k;
          break;
        }
      }
      intervals.push([pos, splitAt, false]);
      pos = splitAt;
      while (pos < plain.length && plain[pos] === " ") pos++;
    }

    return intervals.map(([rStart, rEnd, ellipsize]) => {
      const rowSpans = [];
      let cur = 0;
      for (let i = 0; i < spans.length; i++) {
        const sp = spans[i];
        const t = sp.text || "";
        const next = cur + t.length;
        if (next > rStart && cur < rEnd) {
          const s0 = Math.max(0, rStart - cur);
          const s1 = Math.min(t.length, rEnd - cur);
          if (s1 > s0) {
            rowSpans.push({ text: t.slice(s0, s1), color: sp.color, hot: sp.hot });
          }
        }
        cur = next;
        if (cur >= rEnd) break;
      }
      if (ellipsize) {
        const tailCol = rowSpans[rowSpans.length - 1]?.color || "#cde8f6";
        rowSpans.push({ text: "…", color: tailCol, hot: false });
      }
      return rowSpans;
    });
  }

  function resolveGutterColor(kind, pal) {
    if (pal.isComfyBY) {
      if (kind === "error") return "#ff453a";
      if (kind === "warn") return "#ff9f0a";
      if (kind === "complete" || kind === "shock") return "#fff36b";
      return "#ffd60a";
    }
    if (pal.primary) return pal.primary;
    if (kind === "error") return "#ff3860";
    if (kind === "warn") return "#ffc845";
    if (kind === "complete" || kind === "shock") return "#38ffb3";
    return "#4df3ff";
  }

  function drawSpanRow(rowSpans, startX, maxRightX, y, lineFs, forceBold, birthFlash, pal, lineKind = "normal") {
    const family = "'Cascadia Mono', 'JetBrains Mono', 'Consolas', monospace";
    let curX = startX;
    for (let s = 0; s < rowSpans.length; s++) {
      const sp = rowSpans[s];
      if (!sp.text) continue;
      if (curX > maxRightX) break;

      if (birthFlash > 0.38) {
        ctx.fillStyle = pal.isComfyBY ? "#fffdf0" : "#ffffff";
      } else if (pal.isComfyBY) {
        if (lineKind === "error") {
          ctx.fillStyle = sp.hot ? "#ff948d" : "#ff453a";
        } else if (lineKind === "warn") {
          ctx.fillStyle = sp.hot ? "#ffd60a" : "#ff9f0a";
        } else if (sp.hot) {
          ctx.fillStyle = sp.text.startsWith("[") ? "#ffd60a" : pal.bright;
        } else {
          ctx.fillStyle = forceBold ? "#ffd60a" : pal.bodyYellow;
        }
      } else if (pal.primary) {
        ctx.fillStyle = sp.hot ? pal.bright : pal.primary;
      } else {
        ctx.fillStyle = sp.color;
      }

      const useBold = forceBold || sp.hot || birthFlash > 0.2;
      ctx.font = `${useBold ? "bold " : ""}${lineFs}px ${family}`;
      ctx.fillText(sp.text, curX, y);
      curX += ctx.measureText(sp.text).width;
    }
    return curX;
  }

  function renderTextTexture(nowMs, dtSec) {
    const w = textCanvas.width;
    const h = textCanvas.height;
    const dpr = textCanvas._dpr || 1;

    ctx.clearRect(0, 0, w, h);
    ctx.save();
    ctx.scale(dpr, dpr);

    const vw = w / dpr;
    const vh = h / dpr;
    const pal = getPaletteColors();
    const accent = pal.headerAccent || pal.accent;

    const headerH = 92;
    const padX = 28;

    ctx.strokeStyle = pal.primary || "rgba(77, 243, 255, 0.45)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(padX, headerH);
    ctx.lineTo(vw - padX, headerH);
    ctx.stroke();

    ctx.font = "bold 13px 'Cascadia Mono', 'Consolas', monospace";
    ctx.fillStyle = pal.bright;
    ctx.fillText("COMFYUI // LOG BLASTER", padX, 22);

    const statusColors = {
      IDLE: "#7a9bb0",
      BLASTING: "#38ffb3",
      COMPLETE: "#4df3ff",
      ERROR: "#ff3e6c",
    };
    const badgeColor = pal.primary || statusColors[state.runState] || "#4df3ff";
    const wsTag = state.wsConnected ? state.runState : "RECONNECTING";
    ctx.fillStyle = badgeColor;
    ctx.fillText(`[${wsTag}]`, padX + 196, 22);

    const elapsed = state.runState === "BLASTING" && state.runStartMs
      ? ((nowMs - state.runStartMs) / 1000).toFixed(1) + "s"
      : (state.lastElapsedSec > 0 ? state.lastElapsedSec.toFixed(1) + "s" : "0.0s");
    ctx.font = "12px 'Cascadia Mono', 'Consolas', monospace";
    ctx.fillStyle = pal.primary || "#bfe8ff";
    const activeList = getFilteredLines();
    const filterBadge = state.filterQuery.trim()
      ? ` [FILTER "${state.filterQuery.trim()}" ${activeList.length}/${state.lines.length}]`
      : "";
    const nodeText = (`NODE: ${state.activeNodeTitle}` + filterBadge).slice(0, 48);
    ctx.fillText(nodeText, padX, 44);

    const barW = Math.min(300, vw * 0.26);
    const barY = 56;
    const barH = 11;
    ctx.strokeStyle = pal.dim;
    ctx.strokeRect(padX, barY, barW, barH);
    const pct = state.stepMax > 0 ? Math.min(1, state.stepVal / state.stepMax) : (state.runState === "BLASTING" ? 0.15 + 0.1 * Math.sin(nowMs * 0.008) : 0);
    if (pct > 0) {
      ctx.fillStyle = pal.primary || "#4dffcb";
      ctx.fillRect(padX + 2, barY + 2, Math.max(2, (barW - 4) * pct), barH - 4);
    }
    ctx.font = "11px 'Cascadia Mono', 'Consolas', monospace";
    ctx.fillStyle = pal.dim;
    const stepStr = state.stepMax > 0
      ? `${state.stepVal}/${state.stepMax} (${Math.round(pct * 100)}%)  ${state.stepRateSmooth > 0 ? state.stepRateSmooth.toFixed(1) + " it/s" : ""}  T+${elapsed}`
      : `T+${elapsed}  |  ${state.lpsDisplay} lines/s  ${state.cpsDisplay} chars/s`;
    ctx.fillText(stepStr, padX, 82);

    // Center block: 48-Band Live Audio FFT / Token Spectrum + Waveform
    const specLeft = Math.max(368, vw * 0.34);
    const specRight = Math.min(vw - 296, vw * 0.69);
    const specW = specRight - specLeft;
    let spectrumStillMoving = false;
    if (specW > 120) {
      const binW = specW / SPECTRUM_BINS;
      const baseY = 76;
      const maxBarH = 54;

      for (let i = 0; i < SPECTRUM_BINS; i++) {
        if (state.spectrum[i] > 0.032 || state.spectrumPeak[i] > 0.032) {
          spectrumStillMoving = true;
        }
        state.spectrum[i] = Math.max(0.03, state.spectrum[i] - dtSec * (state.audioActive ? 3.2 : 1.85));
        if (state.spectrum[i] > state.spectrumPeak[i]) {
          state.spectrumPeak[i] = state.spectrum[i];
        } else {
          state.spectrumPeak[i] = Math.max(0.03, state.spectrumPeak[i] - dtSec * 0.85);
        }

        const val = Math.min(1.0, state.spectrum[i]);
        const bh = Math.max(2, val * maxBarH);
        const bx = specLeft + i * binW;

        if (pal.primary) {
          ctx.fillStyle = val > 0.72 ? pal.bright : pal.primary;
        } else {
          const hue = state.audioActive
            ? 145 + (i / SPECTRUM_BINS) * 185
            : 175 + (i / SPECTRUM_BINS) * 145;
          ctx.fillStyle = val > 0.78 ? "#ffffff" : `hsl(${hue}, 95%, 62%)`;
        }
        ctx.fillRect(bx + 0.5, baseY - bh, Math.max(1.5, binW - 1.6), bh);

        const peakY = baseY - Math.min(1.0, state.spectrumPeak[i]) * maxBarH - 2;
        ctx.fillStyle = pal.bright;
        ctx.fillRect(bx + 0.5, peakY, Math.max(1.5, binW - 1.6), 1.6);
      }

      ctx.strokeStyle = pal.bright;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (let s = 0; s < WAVE_SAMPLES; s++) {
        const idx = (state.waveWriteIdx + s) % WAVE_SAMPLES;
        const wx = specLeft + (s / (WAVE_SAMPLES - 1)) * specW;
        const wy = 24 + state.waveform[idx] * 15;
        if (s === 0) ctx.moveTo(wx, wy);
        else ctx.lineTo(wx, wy);
      }
      ctx.stroke();

      ctx.font = "10px 'Cascadia Mono', 'Consolas', monospace";
      ctx.fillStyle = state.audioActive ? (pal.primary || "#38ffb3") : pal.dim;
      const specLabel = state.audioActive
        ? `LIVE AUDIO FFT REACTIVE [${state.audioInMode !== "OFF" ? state.audioInMode : "SYNTH"}] // BASS ${(state.audioBass * 100).toFixed(0)}%`
        : "LOG TOKEN SPECTRUM // LIVE STREAM ENTROPY";
      ctx.fillText(specLabel, specLeft, 87);
    }

    // Right block: Live Hardware Telemetry (NVML or /system_stats universal fallback)
    const rightX = vw - padX - 258;
    if (rightX > 360) {
      const gt = state.gpuTelemetry;
      const shortGpu = (gt.gpu_name || "GPU")
        .replace("NVIDIA GeForce ", "")
        .replace(" Laptop GPU", "")
        .slice(0, 24);

      ctx.font = "bold 11px 'Cascadia Mono', 'Consolas', monospace";
      ctx.fillStyle = accent;
      ctx.fillText(`COMPUTE: ${shortGpu}`, rightX, 20);

      if (gt.available && gt.vram_total_mib > 0) {
        const vramPct = Math.min(1, gt.vram_used_mib / gt.vram_total_mib);
        const vramGib = (gt.vram_used_mib / 1024).toFixed(1);
        const totGib = (gt.vram_total_mib / 1024).toFixed(1);

        ctx.font = "11px 'Cascadia Mono', 'Consolas', monospace";
        ctx.fillStyle = pal.primary || "#d2f0ff";
        if (gt.metrics_mode === "vram_only") {
          ctx.fillText(`VRAM ${vramGib} / ${totGib} GiB (${Math.round(vramPct * 100)}%)`, rightX, 38);
          ctx.fillStyle = pal.dim;
          ctx.fillText("SOURCE: COMFY /system_stats", rightX, 54);
        } else {
          ctx.fillText(`GPU ${String(gt.gpu_util).padStart(3, " ")}% | VRAM ${vramGib}/${totGib}G`, rightX, 38);
          ctx.fillText(`TMP  ${String(gt.temp_c).padStart(2, " ")}C | PWR ${gt.power_w}W`, rightX, 54);
        }

        const gw = 250;
        ctx.fillStyle = "rgba(120, 170, 195, 0.24)";
        ctx.fillRect(rightX, 60, gw, 5);
        ctx.fillStyle = pal.primary || (vramPct > 0.9 ? "#ff4d6d" : "#4df3ff");
        ctx.fillRect(rightX, 60, gw * vramPct, 5);
      } else {
        ctx.font = "11px 'Cascadia Mono', 'Consolas', monospace";
        ctx.fillStyle = pal.dim;
        ctx.fillText("TELEMETRY STANDBY", rightX, 40);
      }

      ctx.font = "10px 'Cascadia Mono', 'Consolas', monospace";
      ctx.fillStyle = pal.dim;
      const fxGpuShort = state.shaderRendererName.slice(0, 22);
      ctx.fillText(`FX: ${fxGpuShort} (${state.fps}fps ${state.fpsMode})`, rightX, 82);
    }

    // --- MAIN BLASTING LOG TEXT VIEWPORT (CASCADE | DUAL | DRUM | FLAT) ---
    state.headerSplitUv = 1.0 - Math.min(0.32, Math.max(0.08, (headerH + 4) / Math.max(200, vh)));
    const logTop = headerH + 8;
    const logBottom = vh - 58; // Keeps foreground Hero text cleanly above #controlDock
    const availH = Math.max(90, logBottom - logTop);
    const fs = state.fontSize;
    const monoFamily = "'Cascadia Mono', 'JetBrains Mono', 'Consolas', monospace";

    state.smoothScrollPx *= Math.pow(0.0005, dtSec);
    if (state.smoothScrollPx < 0.35 || state.paused) state.smoothScrollPx = 0;

    ctx.beginPath();
    ctx.rect(0, logTop, vw, availH + 10);
    ctx.clip();
    ctx.textBaseline = "alphabetic";

    const total = activeList.length;
    const clampedScrollBack = Math.min(state.scrollBackLines, Math.max(0, total - 1));
    const endIdx = Math.max(0, total - clampedScrollBack);

    if (state.viewMode === "CASCADE" || state.viewMode === "DRUM") {
      // Giant Foreground Live Stream -> Progressively Shrinking Perspective Trail
      const isDrum = state.viewMode === "DRUM";
      const heroMaxFs = Math.max(24, Math.min(Math.round(vw * 0.036), Math.round(fs * 3.25)));
      const minTrailFs = Math.max(8.5, Math.round(fs * 0.64 * 2) / 2);
      const maxIndent = isDrum ? vw * 0.125 : vw * 0.05;

      // Subtle 3D perspective side guide rails + Hero Stage deck bar
      ctx.save();
      ctx.globalAlpha = isDrum ? 0.30 : 0.18;
      ctx.strokeStyle = pal.primary || accent;
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(padX - 6, logBottom + 3);
      ctx.lineTo(padX + maxIndent - 4, logTop + 4);
      ctx.moveTo(vw - padX + 6, logBottom + 3);
      ctx.lineTo(vw - padX - maxIndent + 4, logTop + 4);
      ctx.stroke();

      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      ctx.moveTo(padX - 6, logBottom + 4);
      ctx.lineTo(vw - padX + 6, logBottom + 4);
      ctx.stroke();
      ctx.restore();

      let cursorBottomY = logBottom - 6 + state.smoothScrollPx;
      for (let i = endIdx - 1; i >= 0; i--) {
        if (cursorBottomY < logTop - 8) break;
        const line = activeList[i];
        const isHeroRow = (i === endIdx - 1);

        const distPx = Math.max(0, (logBottom - 6) - cursorBottomY);
        const distNorm = Math.min(1.0, distPx / Math.max(120, availH));
        const scaleCurve = Math.pow(1.0 - distNorm, isDrum ? 2.45 : 2.8);
        let lineFs = Math.max(
          minTrailFs,
          Math.round((minTrailFs + (heroMaxFs - minTrailFs) * scaleCurve) * 2) / 2
        );

        const indentX = Math.round(Math.pow(distNorm, 1.4) * maxIndent);
        const rowLeft = padX + indentX;
        const rowRight = vw - padX - indentX;

        const isBigTier = lineFs >= 21;
        const metaFs = isBigTier
          ? Math.max(11, Math.round(lineFs * 0.36))
          : Math.max(8.5, Math.round(lineFs * 0.85 * 2) / 2);
        const metaW = Math.round(metaFs * 5.8);
        const textStartX = rowLeft + 10 + metaW;
        const availTextW = Math.max(100, rowRight - textStartX);

        const forceBold = isHeroRow || lineFs >= 25;
        ctx.font = `${forceBold ? "bold " : ""}${lineFs}px ${monoFamily}`;
        let charW = Math.max(4, ctx.measureText("M").width);
        let maxCols = Math.max(14, Math.floor(availTextW / charW));
        // Auto-fit medium-length Hero headlines onto a single unbroken giant row when within 18%
        if (isHeroRow && line.viewRaw.length > maxCols && line.viewRaw.length <= Math.floor(maxCols * 1.18)) {
          lineFs = Math.max(minTrailFs, Math.round(lineFs * (maxCols / line.viewRaw.length) * 2) / 2);
          ctx.font = `${forceBold ? "bold " : ""}${lineFs}px ${monoFamily}`;
          charW = Math.max(4, ctx.measureText("M").width);
          maxCols = Math.max(14, Math.floor(availTextW / charW));
        }
        const maxWrap = isHeroRow ? 3 : (lineFs >= 23 ? 2 : 1);
        const wrappedRows = wrapSpansMonospace(line.spans, maxCols, maxWrap);

        const subLineH = Math.round(lineFs * 1.22);
        const blockGap = Math.max(3, Math.round(lineFs * 0.24));
        const targetBlockH = wrappedRows.length * subLineH + blockGap;
        const blockH = line._smoothH > 0
          ? line._smoothH + (targetBlockH - line._smoothH) * Math.min(1, dtSec * 22)
          : targetBlockH;
        line._smoothH = blockH;

        const blockTopY = cursorBottomY - blockH;
        if (cursorBottomY >= logTop - subLineH && blockTopY <= logBottom + subLineH * 2) {
          const ageMs = Math.max(0, nowMs - line.ts);
          const birthFlash = ageMs < 320 ? Math.pow(1.0 - ageMs / 320, 1.65) : 0.0;
          const depthAlpha = isHeroRow
            ? 1.0
            : Math.max(0.28, 1.0 - Math.pow(distNorm, 1.25) * 0.66);
          ctx.globalAlpha = depthAlpha;

          const firstBaselineY = blockTopY + subLineH - Math.round(lineFs * 0.16);
          const barW = isHeroRow ? 5.5 : (lineFs >= 24 ? 4.0 : 2.5);
          if (isHeroRow || line.kind !== "normal" || birthFlash > 0.2) {
            ctx.fillStyle = birthFlash > 0.45 ? "#ffffff" : resolveGutterColor(line.kind, pal);
            ctx.fillRect(
              rowLeft,
              firstBaselineY - lineFs * 0.84,
              barW,
              wrappedRows.length * subLineH - lineFs * 0.12
            );
          }

          ctx.font = `${isHeroRow ? "bold " : ""}${metaFs}px ${monoFamily}`;
          ctx.fillStyle = isHeroRow ? (pal.primary || accent) : (birthFlash > 0.5 ? pal.bright : pal.dim);
          ctx.fillText(line.timeStr, rowLeft + barW + 5, firstBaselineY - (isBigTier ? Math.round(lineFs * 0.18) : 0));

          if (isHeroRow) {
            ctx.font = `bold ${Math.max(10, Math.round(metaFs * 0.82))}px ${monoFamily}`;
            ctx.fillStyle = pal.bright;
            const heroTag = state.paused ? "SPOTLIGHT" : "LIVE NOW";
            ctx.fillText(heroTag, rowLeft + barW + 5, firstBaselineY - Math.round(lineFs * 0.18) + metaFs + 3);
          }

          let lastRowEndX = textStartX;
          let lastRowY = firstBaselineY;
          for (let r = 0; r < wrappedRows.length; r++) {
            const ry = firstBaselineY + r * subLineH;
            lastRowY = ry;
            lastRowEndX = drawSpanRow(
              wrappedRows[r],
              textStartX,
              rowRight,
              ry,
              lineFs,
              forceBold,
              birthFlash,
              pal,
              line.kind
            );
          }

          if (isHeroRow && !state.paused && Math.sin(nowMs * 0.012) > -0.25) {
            ctx.fillStyle = pal.bright;
            ctx.fillRect(
              Math.min(rowRight - lineFs * 0.5, lastRowEndX + 6),
              lastRowY - lineFs * 0.80,
              Math.max(8, lineFs * 0.44),
              lineFs * 0.88
            );
          }
        }

        cursorBottomY -= blockH;
      }
      ctx.globalAlpha = 1.0;
    } else {
      // Uniform Background Stream (used by FLAT and Layer-1 of DUAL)
      const bgFs = state.viewMode === "DUAL" ? Math.max(11, Math.round(fs * 0.92)) : fs;
      const lineH = Math.round(bgFs * 1.40);
      const visibleCount = Math.max(3, Math.floor(availH / lineH));
      const startIdx = Math.max(0, endIdx - visibleCount - 1);
      const timeW = bgFs * 6.2;
      const textStartX = padX + 10 + timeW;

      ctx.globalAlpha = state.viewMode === "DUAL" ? 0.52 : 1.0;

      for (let i = startIdx; i < endIdx; i++) {
        const line = activeList[i];
        const rowFromBottom = (endIdx - 1) - i;
        const y = logBottom - 6 - rowFromBottom * lineH + state.smoothScrollPx;
        if (y < logTop - lineH || y > logBottom + lineH) continue;

        const ageMs = Math.max(0, nowMs - line.ts);
        const birthFlash = ageMs < 280 ? Math.pow(1.0 - ageMs / 280, 1.7) : 0.0;

        if (line.kind !== "normal" || birthFlash > 0.25) {
          ctx.fillStyle = birthFlash > 0.45 ? "#ffffff" : resolveGutterColor(line.kind, pal);
          ctx.fillRect(padX, y - bgFs + 2, 3.5, bgFs + 1);
        }

        ctx.font = `${bgFs}px ${monoFamily}`;
        ctx.fillStyle = birthFlash > 0.55 ? pal.bright : pal.dim;
        ctx.fillText(line.timeStr, padX + 8, y);

        const endX = drawSpanRow(line.spans, textStartX, vw - padX, y, bgFs, false, birthFlash, pal, line.kind);
        if (birthFlash > 0.15 && endX < vw - padX) {
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(Math.min(vw - padX - 12, endX + 4), y - bgFs + 3, 8 * birthFlash, bgFs - 1);
        }
      }
      ctx.globalAlpha = 1.0;

      if (state.viewMode === "FLAT" && !state.paused && Math.sin(nowMs * 0.011) > -0.2) {
        ctx.fillStyle = pal.bright;
        ctx.fillRect(padX + 8, logBottom - 2, bgFs * 0.65, 3);
      }

      // LAYER 2 OF DUAL MODE: Colossal Foreground Hero Marquee over Ghosted Background Stream!
      if (state.viewMode === "DUAL" && endIdx > 0) {
        const heroLine = activeList[endIdx - 1];
        const prevLine = endIdx >= 2 ? activeList[endIdx - 2] : null;
        let colossalFs = Math.max(28, Math.min(Math.round(vw * 0.043), Math.round(fs * 3.85)));
        const subHeroFs = Math.max(15, Math.round(colossalFs * 0.44));

        ctx.font = `bold ${colossalFs}px ${monoFamily}`;
        let heroCharW = Math.max(6, ctx.measureText("M").width);
        const heroAvailW = Math.max(160, vw - padX * 2 - 28);
        let heroCols = Math.max(14, Math.floor(heroAvailW / heroCharW));
        if (heroLine.viewRaw.length > heroCols && heroLine.viewRaw.length <= Math.floor(heroCols * 1.18)) {
          colossalFs = Math.max(24, Math.round(colossalFs * (heroCols / heroLine.viewRaw.length) * 2) / 2);
          ctx.font = `bold ${colossalFs}px ${monoFamily}`;
          heroCharW = Math.max(6, ctx.measureText("M").width);
          heroCols = Math.max(14, Math.floor(heroAvailW / heroCharW));
        }
        const heroRows = wrapSpansMonospace(heroLine.spans, heroCols, 2);
        const heroSubH = Math.round(colossalFs * 1.18);
        const bandHeight = heroRows.length * heroSubH + subHeroFs + 48;
        const bandTop = Math.max(logTop + 18, logBottom - bandHeight);

        // Soft alpha fade of Layer-1 glyphs behind the foreground Hero Stage (preserves WebGL2 bg!)
        ctx.save();
        ctx.globalCompositeOperation = "destination-out";
        const maskGrad = ctx.createLinearGradient(0, bandTop - 26, 0, logBottom + 8);
        maskGrad.addColorStop(0.0, "rgba(0, 0, 0, 0.0)");
        maskGrad.addColorStop(0.18, "rgba(0, 0, 0, 0.80)");
        maskGrad.addColorStop(0.92, "rgba(0, 0, 0, 0.86)");
        maskGrad.addColorStop(1.0, "rgba(0, 0, 0, 0.35)");
        ctx.fillStyle = maskGrad;
        ctx.fillRect(0, bandTop - 26, vw, (logBottom + 8) - (bandTop - 26));
        ctx.restore();

        // Glowing HUD corner brackets framing the Dual-Layer Hero Stage
        const bCol = resolveGutterColor(heroLine.kind, pal);
        ctx.strokeStyle = bCol;
        ctx.lineWidth = 2.0;
        const cLen = 18;
        ctx.beginPath();
        ctx.moveTo(padX, bandTop + cLen); ctx.lineTo(padX, bandTop); ctx.lineTo(padX + cLen, bandTop);
        ctx.moveTo(vw - padX - cLen, bandTop); ctx.lineTo(vw - padX, bandTop); ctx.lineTo(vw - padX, bandTop + cLen);
        ctx.moveTo(padX, logBottom - cLen); ctx.lineTo(padX, logBottom); ctx.lineTo(padX + cLen, logBottom);
        ctx.moveTo(vw - padX - cLen, logBottom); ctx.lineTo(vw - padX, logBottom); ctx.lineTo(vw - padX, logBottom - cLen);
        ctx.stroke();

        ctx.font = `bold 12px ${monoFamily}`;
        ctx.fillStyle = pal.primary || accent;
        const kicker = `DUAL-LAYER LIVE HERO [${heroLine.timeStr}] // ${state.activeNodeTitle}`.slice(0, 84);
        ctx.fillText(kicker, padX + 14, bandTop + 16);

        if (prevLine) {
          ctx.globalAlpha = 0.68;
          ctx.font = `${subHeroFs}px ${monoFamily}`;
          const prevCharW = Math.max(4, ctx.measureText("M").width);
          const prevRows = wrapSpansMonospace(prevLine.spans, Math.floor(heroAvailW / prevCharW), 1);
          drawSpanRow(prevRows[0], padX + 14, vw - padX - 14, bandTop + 18 + subHeroFs + 4, subHeroFs, false, 0, pal, prevLine.kind);
          ctx.globalAlpha = 1.0;
        }

        const heroAgeMs = Math.max(0, nowMs - heroLine.ts);
        const heroFlash = heroAgeMs < 320 ? Math.pow(1.0 - heroAgeMs / 320, 1.6) : 0.0;
        const firstHeroY = bandTop + 24 + subHeroFs + heroSubH - Math.round(colossalFs * 0.14);
        let endHeroX = padX + 14;
        let endHeroY = firstHeroY;
        for (let r = 0; r < heroRows.length; r++) {
          endHeroY = firstHeroY + r * heroSubH;
          endHeroX = drawSpanRow(
            heroRows[r],
            padX + 14,
            vw - padX - 14,
            endHeroY,
            colossalFs,
            true,
            heroFlash,
            pal,
            heroLine.kind
          );
        }

        if (!state.paused && Math.sin(nowMs * 0.012) > -0.25) {
          ctx.fillStyle = pal.bright;
          ctx.fillRect(
            Math.min(vw - padX - colossalFs * 0.6, endHeroX + 8),
            endHeroY - colossalFs * 0.80,
            Math.max(10, colossalFs * 0.44),
            colossalFs * 0.88
          );
        }
      }
    }

    ctx.restore();
    state.lastClockDrawMs = nowMs;
    state.textDirty = spectrumStillMoving || state.smoothScrollPx > 0.35 || (nowMs - state.newestLineMs) < 340;
  }

  // =========================================================================
  // 9. WEBGL2 2-PASS GPU SHADER ENGINE (+ FX=0 FAST BLIT & ECO GOVERNOR)
  // =========================================================================
  const glCanvas = document.getElementById("glCanvas");
  const gl = glCanvas.getContext("webgl2", {
    powerPreference: preferHighGpu ? "high-performance" : "low-power",
    alpha: false,
    antialias: false,
    depth: false,
    stencil: false,
    preserveDrawingBuffer: false,
  });

  if (!gl) {
    document.body.appendChild(textCanvas);
    textCanvas.style.cssText = "position:fixed;inset:0;width:100vw;height:100vh;";
  } else {
    try {
      const dbg = gl.getExtension("WEBGL_debug_renderer_info");
      if (dbg) {
        const rawRenderer = String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || "");
        const m = rawRenderer.match(/ANGLE \([^,]+,\s*([^,(]+)/i);
        state.shaderRendererName = (m ? m[1] : rawRenderer)
          .replace(/Direct3D11.*$/i, "")
          .replace(/NVIDIA GeForce /i, "")
          .replace(/ Laptop GPU/i, "")
          .trim() || "WebGL2 (Adapter Masked)";
      }
    } catch (_) {}
  }

  const VERT_SRC = `#version 300 es
precision highp float;
out vec2 v_uv;
void main() {
  vec2 pos = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  v_uv = pos;
  gl_Position = vec4(pos * 2.0 - 1.0, 0.0, 1.0);
}
`;

  const FEEDBACK_FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 fragColor;

uniform sampler2D u_textTex;
uniform sampler2D u_prevTex;
uniform vec2 u_res;
uniform float u_time;
uniform int u_preset;
uniform int u_tintMode;
uniform float u_fx;
uniform float u_blastRate;
uniform float u_audioBass;

float hash11(float p) {
  p = fract(p * 0.1031);
  p *= p + 33.33;
  p *= p + p;
  return fract(p);
}

void main() {
  vec4 live = texture(u_textTex, v_uv);
  float fx = clamp(u_fx, 0.0, 1.6);

  if (fx < 0.02) {
    fragColor = vec4(live.rgb * live.a, live.a);
    return;
  }

  vec3 trail = vec3(0.0);
  float drive = clamp(u_blastRate + u_audioBass * 0.85, 0.0, 1.8);

  if (u_preset == 0) {
    vec3 prev = texture(u_prevTex, v_uv).rgb;
    float decay = mix(0.35, 0.78, clamp(fx + u_audioBass * 0.15, 0.0, 1.25));
    trail = prev * decay;
    vec3 currentLit = live.rgb * live.a;
    fragColor = vec4(max(trail, currentLit), live.a);
  } else if (u_preset == 1) {
    float colId = floor(v_uv.x * (u_res.x / 9.0));
    float colSpeed = (0.0022 + 0.0048 * hash11(colId + 7.13)) * (0.7 + drive * 0.75) * fx;
    vec2 dripUv = vec2(v_uv.x, min(0.999, v_uv.y + colSpeed));

    vec3 prevDrip = texture(u_prevTex, dripUv).rgb;
    vec4 srcAbove = texture(u_textTex, dripUv);

    float rainPulse = 0.84 + 0.16 * sin(u_time * 9.0 + colId * 3.7 + v_uv.y * 45.0);
    vec3 matrixTint = (u_tintMode == 1)
      ? mix(vec3(1.0, 0.84, 0.04), vec3(1.0, 0.96, 0.52), hash11(colId * 3.1))
      : mix(vec3(0.10, 1.0, 0.58), vec3(0.25, 0.92, 1.0), hash11(colId * 3.1));

    vec3 spawnedWake = srcAbove.rgb * srcAbove.a * matrixTint * (0.52 + 0.22 * u_audioBass) * clamp(fx, 0.0, 1.35);
    trail = max(prevDrip * 0.875 * rainPulse, spawnedWake);
    vec3 currentLit = live.rgb * live.a;
    fragColor = vec4(max(trail * 0.88, currentLit), live.a);
  } else if (u_preset == 2) {
    vec3 prev = texture(u_prevTex, v_uv).rgb;
    vec3 baseDecay = (u_tintMode == 1) ? vec3(0.90, 0.76, 0.18) : vec3(0.58, 0.85, 0.73);
    vec3 p7Decay = baseDecay * clamp(0.66 + 0.22 * fx, 0.0, 0.91);
    trail = prev * p7Decay;
    vec3 currentLit = live.rgb * live.a;
    fragColor = vec4(max(trail, currentLit), live.a);
  } else {
    vec2 center = vec2(0.5, 0.5);
    float zoomAmt = (0.0025 + 0.006 * clamp(drive, 0.0, 1.4)) * fx;
    vec2 zoomUv = center + (v_uv - center) * (1.0 - zoomAmt);
    vec3 prevZoom = texture(u_prevTex, clamp(zoomUv, vec2(0.001), vec2(0.999))).rgb;
    vec3 neonShift = (u_tintMode == 1)
      ? vec3(prevZoom.r * 0.90, prevZoom.g * 0.78, prevZoom.b * 0.16)
      : vec3(prevZoom.r * 0.84, prevZoom.g * 0.72, prevZoom.b * 0.88);
    vec3 currentLit = live.rgb * live.a;
    fragColor = vec4(max(neonShift, currentLit), live.a);
  }
}
`;

  const COMPOSITE_FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 fragColor;

uniform sampler2D u_textTex;
uniform sampler2D u_feedbackTex;
uniform sampler2D u_audioTex;
uniform vec2 u_res;
uniform float u_time;
uniform int u_preset;
uniform int u_tintMode;
uniform int u_viewMode;
uniform float u_headerSplit;
uniform float u_fx;
uniform float u_blastRate;
uniform float u_stepPulse;
uniform float u_nodePulse;
uniform float u_glitchBurst;
uniform float u_flashPulse;
uniform float u_degauss;
uniform float u_shockTime;
uniform vec2 u_shockCenter;
uniform float u_audioBass;
uniform float u_audioMid;
uniform float u_audioHigh;

float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

vec2 barrelWarp(vec2 uv, float amount) {
  vec2 cc = uv * 2.0 - 1.0;
  float r2 = dot(cc, cc);
  cc *= 1.0 + amount * r2 + (amount * 0.32) * r2 * r2;
  return cc * 0.5 + 0.5;
}

vec3 sampleBloom(sampler2D tex, vec2 uv, vec2 px, float radius) {
  vec3 acc = vec3(0.0);
  vec2 r1 = px * radius;
  vec2 r2 = px * radius * 2.35;

  acc += texture(tex, uv + vec2( r1.x,  0.0)).rgb * 0.16;
  acc += texture(tex, uv + vec2(-r1.x,  0.0)).rgb * 0.16;
  acc += texture(tex, uv + vec2( 0.0,  r1.y)).rgb * 0.16;
  acc += texture(tex, uv + vec2( 0.0, -r1.y)).rgb * 0.16;

  acc += texture(tex, uv + vec2( r2.x,  r2.y)).rgb * 0.09;
  acc += texture(tex, uv + vec2(-r2.x,  r2.y)).rgb * 0.09;
  acc += texture(tex, uv + vec2( r2.x, -r2.y)).rgb * 0.09;
  acc += texture(tex, uv + vec2(-r2.x, -r2.y)).rgb * 0.09;
  return acc;
}

void main() {
  float fx = clamp(u_fx, 0.0, 1.6);

  // Fast raw-terminal blit path when FX == 0% (zero bloom, zero warp, minimal GPU cost)
  if (fx < 0.02) {
    vec4 rawT = texture(u_textTex, v_uv);
    vec3 flatBg = (u_tintMode == 1) ? vec3(0.014, 0.013, 0.008) : vec3(0.015, 0.022, 0.032);
    fragColor = vec4(mix(flatBg, rawT.rgb, rawT.a), 1.0);
    return;
  }

  vec2 px = 1.0 / max(u_res, vec2(1.0));
  vec2 uv = v_uv;

  if (u_audioBass > 0.05) {
    float bassZoom = 1.0 - (u_audioBass * 0.0085 * min(fx, 1.3));
    uv = vec2(0.5) + (uv - vec2(0.5)) * bassZoom;
  }

  float warpStrength = 0.0;
  if (u_preset == 0) warpStrength = 0.056 * min(fx, 1.25);
  else if (u_preset == 2) warpStrength = 0.038 * min(fx, 1.2);
  else if (u_preset == 3) warpStrength = 0.048 * min(fx, 1.2);

  if (u_degauss > 0.01) {
    float wob = sin(u_time * 42.0 + uv.y * 12.0) * 0.014 * u_degauss * fx;
    uv.x += wob;
    uv.y += cos(u_time * 35.0) * 0.006 * u_degauss * fx;
  }

  if (warpStrength > 0.0005) {
    uv = barrelWarp(uv, warpStrength);
  }

  if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
    float bezelDist = max(max(-uv.x, uv.x - 1.0), max(-uv.y, uv.y - 1.0));
    vec3 bezelBase = (u_tintMode == 1) ? vec3(0.020, 0.017, 0.006) : vec3(0.015, 0.02, 0.028);
    vec3 bezel = bezelBase * exp(-bezelDist * 45.0);
    fragColor = vec4(bezel, 1.0);
    return;
  }

  // 3D Cylindrical Drum & Perspective Tilt for DRUM (2) and subtle glass arch for CASCADE (0)
  float drumSideShade = 1.0;
  if ((u_viewMode == 2 || u_viewMode == 0) && uv.y < u_headerSplit && uv.y > 0.055) {
    float stageSpan = max(0.2, u_headerSplit - 0.055);
    float stageT = clamp((uv.y - 0.055) / stageSpan, 0.0, 1.0);
    float dx = uv.x - 0.5;
    if (u_viewMode == 2) {
      float xScale = mix(0.94, 1.22, pow(stageT, 1.2));
      float drumArch = (dx * dx) * 0.115 * sin(stageT * 3.14159) * min(fx, 1.25);
      float curvedT = pow(stageT, 0.88);
      uv.x = 0.5 + dx * xScale;
      uv.y = clamp(0.055 + curvedT * stageSpan + drumArch, 0.002, u_headerSplit - 0.002);
      float outX = max(0.0, max(-uv.x, uv.x - 1.0));
      drumSideShade = exp(-outX * 26.0) * (1.0 - 0.32 * (dx * dx * 4.0) * stageT);
      uv.x = clamp(uv.x, 0.001, 0.999);
    } else {
      float subtleArch = (dx * dx) * 0.026 * sin(stageT * 3.14159) * min(fx, 1.2);
      uv.y = clamp(uv.y + subtleArch, 0.002, u_headerSplit - 0.002);
    }
  }

  float shockAge = u_time - u_shockTime;
  float shockRing = 0.0;
  if (shockAge >= 0.0 && shockAge < 1.35) {
    vec2 aspect = vec2(u_res.x / max(u_res.y, 1.0), 1.0);
    vec2 delta = (uv - u_shockCenter) * aspect;
    float dist = length(delta);
    float radius = shockAge * 1.15;
    float band = exp(-pow((dist - radius) * 26.0, 2.0)) * (1.0 - shockAge / 1.35);
    shockRing = band;
    float refractScale = (u_preset == 3 ? 0.026 : 0.012) * fx;
    vec2 dir = dist > 0.0001 ? normalize(delta) : vec2(0.0);
    uv -= (dir / aspect) * band * refractScale;
  }

  float waveAtX = (texture(u_audioTex, vec2(uv.x, 0.25)).r - 0.5) * 2.0;
  float waveAtY = (texture(u_audioTex, vec2(uv.y, 0.25)).r - 0.5) * 2.0;
  float fftAtX  = texture(u_audioTex, vec2(uv.x * 0.72, 0.75)).r;

  float sliceGlitch = 0.0;
  if (u_preset == 1) {
    float activity = clamp(u_blastRate * 0.45 + u_nodePulse * 0.9 + u_glitchBurst * 1.4 + u_audioHigh * 0.75, 0.0, 1.9);
    float bandY = floor(uv.y * 34.0 + floor(u_time * 18.0));
    float rnd = hash12(vec2(bandY, floor(u_time * 22.0)));
    float threshold = 0.965 - 0.14 * activity * min(fx, 1.4);
    if (rnd > threshold) {
      sliceGlitch = (hash12(vec2(bandY * 1.7, u_time)) - 0.5) * 0.055 * fx * (0.4 + activity);
      uv.x = clamp(uv.x + sliceGlitch, 0.001, 0.999);
    }
  } else if (u_preset == 2) {
    float carrier = sin(uv.y * 55.0 - u_time * 7.5) * cos(uv.y * 19.0 + u_time * 4.2);
    float energy = (0.0006 + 0.0022 * clamp(u_blastRate, 0.0, 1.2) + 0.0024 * u_stepPulse) * fx;
    float audioDeflect = waveAtY * (0.0045 * clamp(u_audioMid + u_audioBass * 0.6, 0.0, 1.5)) * fx;
    uv.x = clamp(uv.x + carrier * energy + audioDeflect, 0.001, 0.999);
  } else if (u_glitchBurst > 0.05) {
    float bandY = floor(uv.y * 28.0);
    float rnd = hash12(vec2(bandY, floor(u_time * 30.0)));
    if (rnd > 0.82) {
      uv.x = clamp(uv.x + (rnd - 0.9) * 0.08 * u_glitchBurst * fx, 0.001, 0.999);
    }
  }

  float chromaPx = 0.0;
  if (u_preset == 0) {
    float edge = length(uv - 0.5) * 1.5;
    chromaPx = (0.8 + 1.8 * edge + 2.5 * u_audioHigh) * fx;
  } else if (u_preset == 1) {
    chromaPx = (1.8 + 4.5 * clamp(u_blastRate, 0.0, 1.2) + 5.5 * u_audioHigh + 9.0 * abs(sliceGlitch) * 20.0 + 7.0 * u_glitchBurst) * fx;
  } else if (u_preset == 2) {
    chromaPx = (0.6 + 2.2 * u_stepPulse + 2.4 * u_audioHigh) * fx;
  } else {
    chromaPx = (1.5 + 8.0 * shockRing + 3.5 * u_nodePulse + 4.0 * u_audioBass) * fx;
  }

  vec2 cOff = vec2(px.x * chromaPx, 0.0);
  vec4 tL = texture(u_textTex, clamp(uv + cOff, vec2(0.0), vec2(1.0)));
  vec4 tC = texture(u_textTex, uv);
  vec4 tR = texture(u_textTex, clamp(uv - cOff, vec2(0.0), vec2(1.0)));

  vec3 crispGlyph = vec3(tL.r * tL.a, tC.g * tC.a, tR.b * tR.a);

  vec3 trail = texture(u_feedbackTex, uv).rgb;
  float bloomRad = (u_preset == 3 ? 2.8 : (u_preset == 0 ? 2.4 : 2.1)) * (0.6 + 0.6 * fx + 0.55 * u_audioBass);
  vec3 bloom = sampleBloom(u_feedbackTex, uv, px, bloomRad) * (0.65 + 0.65 * fx + 0.55 * u_audioBass);

  vec3 bg = vec3(0.015, 0.022, 0.032);

  if (u_preset == 0) {
    float hum = 0.5 + 0.5 * sin(uv.y * 6.2831 - u_time * 1.9);
    if (u_tintMode == 1) {
      bg = vec3(0.013, 0.012, 0.007) + vec3(0.018, 0.014, 0.002) * pow(hum, 4.0) * fx;
    } else {
      bg = vec3(0.016, 0.020, 0.026) + vec3(0.008, 0.012, 0.015) * pow(hum, 4.0) * fx;
    }
  } else if (u_preset == 1) {
    vec2 grid = abs(fract(uv * vec2(48.0, 28.0)) - 0.5);
    float gLine = smoothstep(0.48, 0.5, max(grid.x, grid.y));
    float laser = exp(-abs(uv.y - fract(-u_time * 0.18)) * 55.0);
    if (u_tintMode == 1) {
      bg = vec3(0.009, 0.009, 0.005) + vec3(0.088, 0.070, 0.004) * gLine * min(fx, 1.0);
      bg += vec3(0.18, 0.145, 0.010) * laser * min(fx, 1.2);
      if (uv.y < fftAtX * 0.22 * min(fx, 1.3)) {
        bg += vec3(0.12, 0.095, 0.005) * (1.0 - uv.y / max(0.01, fftAtX * 0.22));
      }
    } else {
      bg = vec3(0.010, 0.016, 0.024) + vec3(0.0, 0.045, 0.055) * gLine * min(fx, 1.0);
      bg += vec3(0.02, 0.10, 0.12) * laser * min(fx, 1.2);
      if (uv.y < fftAtX * 0.22 * min(fx, 1.3)) {
        bg += vec3(0.0, 0.06, 0.08) * (1.0 - uv.y / max(0.01, fftAtX * 0.22));
      }
    }
  } else if (u_preset == 2) {
    bg = (u_tintMode == 1) ? vec3(0.010, 0.009, 0.005) : vec3(0.008, 0.030, 0.022);
    vec2 div = uv * vec2(10.0, 8.0);
    vec2 fDiv = abs(fract(div) - 0.5);
    float majorGrid = 1.0 - smoothstep(0.0, 0.022, min(fDiv.x, fDiv.y));
    vec2 subDiv = abs(fract(div * 5.0) - 0.5);
    float centerAxes = (abs(uv.x - 0.5) < 0.008 || abs(uv.y - 0.5) < 0.01) ? 1.0 : 0.0;
    float minorTicks = (1.0 - smoothstep(0.0, 0.06, min(subDiv.x, subDiv.y))) * centerAxes;

    vec3 gratColor = (u_tintMode == 1)
      ? vec3(0.21, 0.165, 0.03)
      : mix(vec3(0.04, 0.16, 0.11), vec3(0.24, 0.15, 0.05), 0.45);
    bg += gratColor * (majorGrid * 0.55 + minorTicks * 0.75) * min(fx, 1.2);

    float waveY = 0.46 + waveAtX * 0.22 * min(fx, 1.35);
    float beamDist = abs(uv.y - waveY);
    float scopeCore = exp(-beamDist * 250.0);
    float scopeHalo = exp(-beamDist * 34.0) * (0.26 + 0.25 * u_audioMid);
    vec3 coreCol = (u_tintMode == 1) ? vec3(1.0, 0.92, 0.24) : vec3(0.58, 1.0, 0.84);
    vec3 haloCol = (u_tintMode == 1) ? vec3(0.88, 0.66, 0.03) : vec3(0.08, 0.68, 0.44);
    bg += (coreCol * scopeCore * 0.52 + haloCol * scopeHalo) * min(fx, 1.35);
  } else {
    bg = (u_tintMode == 1)
      ? mix(vec3(0.016, 0.013, 0.004), vec3(0.006, 0.006, 0.004), uv.y)
      : mix(vec3(0.025, 0.008, 0.048), vec3(0.008, 0.020, 0.045), uv.y);
    float horizonY = 0.36 + u_audioBass * 0.035 * min(fx, 1.3);
    if (uv.y < horizonY) {
      float py = max(0.015, horizonY - uv.y);
      float z = 0.14 / py;
      float xProj = (uv.x - 0.5) * z * 2.4;
      float gx = 1.0 - smoothstep(0.0, 0.06, abs(fract(xProj) - 0.5));
      float gz = 1.0 - smoothstep(0.0, 0.07, abs(fract(z - u_time * (0.8 + u_blastRate + u_audioBass)) - 0.5));
      float fade = smoothstep(horizonY, 0.02, uv.y);
      vec3 gridCol = (u_tintMode == 1)
        ? vec3(0.78 + u_audioBass * 0.30, 0.62, 0.02)
        : vec3(0.48 + u_audioBass * 0.35, 0.06, 0.42);
      bg += gridCol * max(gx, gz) * fade * 0.46 * min(fx, 1.25);
    }
    float eqTop = horizonY + fftAtX * 0.14 * min(fx, 1.3);
    if (uv.y >= horizonY && uv.y < eqTop) {
      vec3 eqCol = (u_tintMode == 1) ? vec3(0.50, 0.39, 0.02) : vec3(0.32, 0.05, 0.28);
      bg += eqCol * (1.0 - (uv.y - horizonY) / max(0.005, eqTop - horizonY)) * 0.45;
    }
  }

  // Suppress old feedback ghosting directly underneath crisp foreground glyph interiors so huge fast text never smears
  vec3 col = bg + trail * (0.54 * (1.0 - tC.a * 0.72)) + bloom;

  if (u_preset == 3 && fx > 0.1 && (u_tintMode == 0 || u_tintMode == 1)) {
    vec3 neonGrad = (u_tintMode == 1)
      ? mix(vec3(1.0, 0.84, 0.04), vec3(1.0, 0.98, 0.72), fract(uv.y * 2.2 - u_time * 0.25))
      : mix(vec3(1.0, 0.38, 0.82), vec3(0.35, 0.96, 1.0), fract(uv.y * 2.2 - u_time * 0.25));
    float luma = dot(crispGlyph, vec3(0.299, 0.587, 0.114));
    crispGlyph = mix(crispGlyph, crispGlyph * 0.55 + neonGrad * luma * 0.85, 0.38 * min(fx, 1.2));
  }

  col = (max(col, crispGlyph) + crispGlyph * (0.22 + 0.16 * u_audioBass) * fx) * drumSideShade;

  if (shockRing > 0.002) {
    vec3 ringCol = (u_tintMode == 1) ? vec3(1.0, 0.85, 0.08)
                 : (u_tintMode == 2 ? vec3(1.0, 0.72, 0.16)
                 : (u_tintMode == 3 ? vec3(0.22, 1.0, 0.45)
                 : (u_preset == 3 ? vec3(1.0, 0.32, 0.78) : vec3(0.35, 0.95, 1.0))));
    col += ringCol * shockRing * 0.42 * fx;
  }

  if (abs(sliceGlitch) > 0.008) {
    vec3 glitchTint = (u_tintMode == 1) ? vec3(col.r, col.g * 0.85, 0.05) : (col.gbr + vec3(0.08, 0.0, 0.06));
    col = mix(col, glitchTint, 0.35);
  }

  float scanFreq = u_res.y * 0.5;
  float scanWave = 0.5 + 0.5 * sin(uv.y * scanFreq * 3.14159);
  float charBrightness = clamp(dot(crispGlyph, vec3(0.333)), 0.0, 1.0);
  float scanDepth = (u_preset == 0 ? 0.26 : (u_preset == 2 ? 0.16 : 0.14)) * min(fx, 1.3) * (1.0 - charBrightness * 0.58);
  col *= (1.0 - scanDepth * scanWave);

  if (u_preset == 0 || u_preset == 3) {
    float triad = mod(floor(uv.x * u_res.x), 3.0);
    vec3 mask = triad < 1.0 ? vec3(1.06, 0.96, 0.96)
              : (triad < 2.0 ? vec3(0.96, 1.06, 0.96) : vec3(0.96, 0.96, 1.06));
    col *= mix(vec3(1.0), mask, 0.45 * min(fx, 1.0));
  }

  vec3 flashCol = (u_tintMode == 1) ? vec3(0.45, 0.37, 0.04) : vec3(0.20, 0.38, 0.35);
  col += flashCol * u_flashPulse * 0.32 * min(fx, 1.2);

  vec2 vigUv = uv * (1.0 - uv.yx);
  float vig = pow(max(0.0, vigUv.x * vigUv.y * 16.0), 0.16 * min(fx, 1.2));
  col *= mix(1.0, vig, 0.75 * min(fx, 1.0));

  if ((u_preset == 0 || u_preset == 2) && fx > 0.1) {
    float sheen = exp(-length(uv - vec2(0.14, 0.88)) * 7.5) * 0.035 * min(fx, 1.0);
    vec3 sheenCol = (u_tintMode == 1) ? vec3(1.0, 0.92, 0.55) : vec3(0.7, 0.88, 1.0);
    col += sheenCol * sheen;
  }

  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

  function compileShader(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error("[LogBlaster] GLSL compile error:", gl.getShaderInfoLog(sh));
      gl.deleteShader(sh);
      return null;
    }
    return sh;
  }

  function createProgram(vsSrc, fsSrc) {
    const vs = compileShader(gl.VERTEX_SHADER, vsSrc);
    const fs = compileShader(gl.FRAGMENT_SHADER, fsSrc);
    if (!vs || !fs) return null;
    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.error("[LogBlaster] GLSL link error:", gl.getProgramInfoLog(prog));
      return null;
    }
    return prog;
  }

  let feedbackProg = null;
  let compositeProg = null;
  let emptyVao = null;
  let textTex = null;
  let audioTex = null;
  let fboA = null, texA = null;
  let fboB = null, texB = null;
  let fbUniforms = {};
  let compUniforms = {};

  function makeRenderTarget(w, h) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const complete = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { fbo, tex, complete };
  }

  function initGlPrograms() {
    if (!gl || state.contextLost) return;
    feedbackProg = createProgram(VERT_SRC, FEEDBACK_FRAG);
    compositeProg = createProgram(VERT_SRC, COMPOSITE_FRAG);
    emptyVao = gl.createVertexArray();
    fbUniforms = {};
    compUniforms = {};

    if (feedbackProg) {
      for (const u of [
        "u_textTex", "u_prevTex", "u_res", "u_time", "u_preset",
        "u_tintMode", "u_fx", "u_blastRate", "u_audioBass",
      ]) {
        fbUniforms[u] = gl.getUniformLocation(feedbackProg, u);
      }
    }
    if (compositeProg) {
      for (const u of [
        "u_textTex", "u_feedbackTex", "u_audioTex", "u_res", "u_time", "u_preset",
        "u_tintMode", "u_viewMode", "u_headerSplit", "u_fx",
        "u_blastRate", "u_stepPulse", "u_nodePulse", "u_glitchBurst",
        "u_flashPulse", "u_degauss", "u_shockTime", "u_shockCenter",
        "u_audioBass", "u_audioMid", "u_audioHigh",
      ]) {
        compUniforms[u] = gl.getUniformLocation(compositeProg, u);
      }
    }
  }

  function resizePipelines(forceRebuild = false) {
    const cssW = Math.max(320, window.innerWidth || 320);
    const cssH = Math.max(200, window.innerHeight || 200);
    const rawDpr = Math.min(window.devicePixelRatio || 1, 1.5);
    let w = Math.max(320, Math.floor(cssW * rawDpr));
    let h = Math.max(200, Math.floor(cssH * rawDpr));

    // Bound 4K/5K render-target VRAM below ~30 MiB total across textTex + ping-pong FBOs
    let scale = 1.0;
    if (w > MAX_RENDER_WIDTH) scale = Math.min(scale, MAX_RENDER_WIDTH / w);
    if (w * h * scale * scale > MAX_RENDER_PIXELS) {
      scale = Math.min(scale, Math.sqrt(MAX_RENDER_PIXELS / (w * h)));
    }
    if (scale < 1.0) {
      w = Math.max(320, Math.floor(w * scale));
      h = Math.max(200, Math.floor(h * scale));
    }

    if (!forceRebuild && glCanvas.width === w && glCanvas.height === h) return;

    glCanvas.width = w;
    glCanvas.height = h;
    textCanvas.width = w;
    textCanvas.height = h;
    textCanvas._dpr = w / cssW;
    state.textDirty = true;

    if (!gl || state.contextLost) return;

    if (!textTex || forceRebuild) textTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, textTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    if (!audioTex || forceRebuild) {
      audioTex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, audioTex);
      gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, AUDIO_TEX_WIDTH, 2, 0, gl.RED, gl.UNSIGNED_BYTE, state.audioTexBytes);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    }

    if (fboA) { try { gl.deleteFramebuffer(fboA); gl.deleteTexture(texA); } catch (_) {} }
    if (fboB) { try { gl.deleteFramebuffer(fboB); gl.deleteTexture(texB); } catch (_) {} }

    const rtA = makeRenderTarget(w, h);
    const rtB = makeRenderTarget(w, h);
    fboA = rtA.fbo; texA = rtA.tex;
    fboB = rtB.fbo; texB = rtB.tex;
    state.fboReady = Boolean(rtA.complete && rtB.complete);
  }

  if (gl) {
    initGlPrograms();

    glCanvas.addEventListener("webglcontextlost", (ev) => {
      ev.preventDefault();
      state.contextLost = true;
      state.fboReady = false;
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = 0;
      }
    });

    glCanvas.addEventListener("webglcontextrestored", () => {
      state.contextLost = false;
      textTex = null;
      audioTex = null;
      fboA = null; texA = null;
      fboB = null; texB = null;
      initGlPrograms();
      resizePipelines(true);
      state.textDirty = true;
      scheduleNextFrame();
    });
  }

  window.addEventListener("resize", () => resizePipelines(false));
  resizePipelines(false);

  // =========================================================================
  // 10. ECO-GOVERNED MAIN RENDER LOOP + DIRTY-GATED TEXTURE UPLOADS
  // =========================================================================
  let rafId = 0;
  let lastDrawMs = 0;
  let fpsFrames = 0;
  let fpsTimerMs = performance.now();
  let pingPong = false;

  function scheduleNextFrame() {
    if (!rafId && !document.hidden && !state.contextLost) {
      rafId = requestAnimationFrame(renderFrame);
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = 0;
      }
    } else {
      lastDrawMs = 0;
      state.textDirty = true;
      pollTelemetry();
      scheduleNextFrame();
    }
  });

  function targetFrameIntervalMs(nowMs) {
    if (state.fpsMode === "MAX") return 0;
    if (state.fpsMode === "60") return 15.8;
    // ECO mode: 30 FPS when workflow/audio/pulses are active; 15 FPS when quiet/idle!
    const tSec = nowMs * 0.001;
    const isAnimated =
      state.runState === "BLASTING" ||
      state.audioActive ||
      state.textDirty ||
      state.blastRate > 0.02 ||
      state.stepPulse > 0.02 ||
      state.nodePulse > 0.02 ||
      state.glitchBurst > 0.02 ||
      state.flashPulse > 0.02 ||
      state.degaussWobble > 0.02 ||
      (tSec - state.shockwaveTime) < 1.4;
    return isAnimated ? 32.0 : 65.0;
  }

  function renderFrame(nowMs) {
    rafId = 0;
    if (document.hidden || state.contextLost) {
      return;
    }
    scheduleNextFrame();

    const minInterval = targetFrameIntervalMs(nowMs);
    if (minInterval > 0 && (nowMs - lastDrawMs) < minInterval) {
      return;
    }

    const dtSec = lastDrawMs > 0 ? Math.min(0.12, Math.max(0.001, (nowMs - lastDrawMs) / 1000)) : 0.016;
    lastDrawMs = nowMs;

    fpsFrames++;
    if (nowMs - fpsTimerMs >= 600) {
      state.fps = Math.round((fpsFrames * 1000) / (nowMs - fpsTimerMs));
      fpsFrames = 0;
      fpsTimerMs = nowMs;
      state.textDirty = true;
    }

    state.blastRate = Math.max(0.0, state.blastRate - dtSec * 0.72);
    state.stepPulse = Math.max(0.0, state.stepPulse - dtSec * 2.6);
    state.nodePulse = Math.max(0.0, state.nodePulse - dtSec * 1.9);
    state.glitchBurst = Math.max(0.0, state.glitchBurst - dtSec * 1.65);
    state.flashPulse = Math.max(0.0, state.flashPulse - dtSec * 1.8);
    state.degaussWobble = Math.max(0.0, state.degaussWobble - dtSec * 1.4);

    updateAudioAnalysis(nowMs, dtSec);

    // Dirty-gate 2D canvas rasterization & texture upload (refresh every 480ms idle for cursor/timer)
    const needCanvasUpload =
      state.textDirty ||
      state.runState === "BLASTING" ||
      (nowMs - state.lastClockDrawMs) >= 480;

    if (needCanvasUpload) {
      renderTextTexture(nowMs, dtSec);
    }

    if (!gl || !compositeProg) return;

    const w = glCanvas.width;
    const h = glCanvas.height;
    const tSec = nowMs * 0.001;

    if (needCanvasUpload) {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, textTex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, textCanvas);
    }

    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, audioTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, AUDIO_TEX_WIDTH, 2, gl.RED, gl.UNSIGNED_BYTE, state.audioTexBytes);

    gl.bindVertexArray(emptyVao);

    let writeTex = textTex;
    // Fast-path: skip Pass 1 feedback FBO completely when FX == 0% or FBO incomplete
    if (state.fxIntensity >= 0.02 && state.fboReady && feedbackProg) {
      const readTex = pingPong ? texA : texB;
      const writeFbo = pingPong ? fboB : fboA;
      writeTex = pingPong ? texB : texA;
      pingPong = !pingPong;

      gl.bindFramebuffer(gl.FRAMEBUFFER, writeFbo);
      gl.viewport(0, 0, w, h);
      gl.useProgram(feedbackProg);

      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, textTex);
      gl.uniform1i(fbUniforms.u_textTex, 0);

      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, readTex);
      gl.uniform1i(fbUniforms.u_prevTex, 1);

      gl.uniform2f(fbUniforms.u_res, w, h);
      gl.uniform1f(fbUniforms.u_time, tSec);
      gl.uniform1i(fbUniforms.u_preset, state.preset);
      gl.uniform1i(fbUniforms.u_tintMode, state.tintMode);
      gl.uniform1f(fbUniforms.u_fx, state.fxIntensity);
      gl.uniform1f(fbUniforms.u_blastRate, state.blastRate);
      gl.uniform1f(fbUniforms.u_audioBass, state.audioBass);

      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    // PASS 2 -> Final Audio-Reactive GPU Composite
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, w, h);
    gl.useProgram(compositeProg);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, textTex);
    gl.uniform1i(compUniforms.u_textTex, 0);

    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, writeTex);
    gl.uniform1i(compUniforms.u_feedbackTex, 1);

    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, audioTex);
    gl.uniform1i(compUniforms.u_audioTex, 2);

    gl.uniform2f(compUniforms.u_res, w, h);
    gl.uniform1f(compUniforms.u_time, tSec);
    gl.uniform1i(compUniforms.u_preset, state.preset);
    gl.uniform1i(compUniforms.u_tintMode, state.tintMode);
    gl.uniform1i(compUniforms.u_viewMode, Math.max(0, VIEW_MODES.indexOf(state.viewMode)));
    gl.uniform1f(compUniforms.u_headerSplit, state.headerSplitUv || 0.88);
    gl.uniform1f(compUniforms.u_fx, state.fxIntensity);
    gl.uniform1f(compUniforms.u_blastRate, state.blastRate);
    gl.uniform1f(compUniforms.u_stepPulse, state.stepPulse);
    gl.uniform1f(compUniforms.u_nodePulse, state.nodePulse);
    gl.uniform1f(compUniforms.u_glitchBurst, state.glitchBurst);
    gl.uniform1f(compUniforms.u_flashPulse, state.flashPulse);
    gl.uniform1f(compUniforms.u_degauss, state.degaussWobble);
    gl.uniform1f(compUniforms.u_shockTime, state.shockwaveTime);
    gl.uniform2f(compUniforms.u_shockCenter, state.shockwaveCenter[0], state.shockwaveCenter[1]);
    gl.uniform1f(compUniforms.u_audioBass, state.audioBass);
    gl.uniform1f(compUniforms.u_audioMid, state.audioMid);
    gl.uniform1f(compUniforms.u_audioHigh, state.audioHigh);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  ingestLogChunk("[LogBlaster] Audio-Reactive WebGL2 GPU Log Visualizer ready (1-4 Shaders | V View | Y Comfy B&Y | T Tint | / Filter | E Errors | M Synth | A Audio | B Blast)\n");
  ingestLogChunk(`[LogBlaster] View: ${state.viewMode} | Palette: ${TINT_NAMES[state.tintMode]} | WebGL2: ${state.shaderRendererName} | FPS: ${state.fpsMode} | Redaction: ${state.redactEnabled ? "ON" : "OFF"}\n`);
  connectComfySocket();
  scheduleNextFrame();
})();
</script>
