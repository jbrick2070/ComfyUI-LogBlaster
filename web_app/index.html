<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ComfyUI // LOG BLASTER — Audio-Reactive GPU Shader Terminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2306101a'/%3E%3Cpath d='M6 18h5l3-9 4 14 3-7h5' stroke='%234df3ff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root {
    --hud-bg: rgba(8, 12, 18, 0.84);
    --hud-border: rgba(92, 225, 230, 0.34);
    --hud-accent: #4df3ff;
    --hud-hot: #ff3e7f;
    --hud-ok: #38ffb3;
    --hud-audio: #ffc845;
    --hud-text: #d9f4ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030508;
    color: var(--hud-text);
    font-family: "Cascadia Mono", "JetBrains Mono", "Consolas", "Courier New", monospace;
    user-select: none;
  }
  #glCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }
  #controlDock {
    position: fixed;
    bottom: 14px;
    right: 16px;
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 7px 11px;
    border-radius: 10px;
    background: var(--hud-bg);
    border: 1px solid var(--hud-border);
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.65);
    opacity: 0.44;
    transition: opacity 0.2s ease, border-color 0.2s ease;
    font-size: 11px;
  }
  #controlDock:hover, #controlDock:focus-within {
    opacity: 0.98;
    border-color: rgba(92, 225, 230, 0.72);
  }
  .dock-group {
    display: flex;
    align-items: center;
    gap: 4px;
    padding-right: 6px;
    border-right: 1px solid rgba(255, 255, 255, 0.12);
  }
  .dock-group:last-child {
    border-right: none;
    padding-right: 0;
  }
  button.hud-btn {
    background: rgba(255, 255, 255, 0.06);
    color: #cbe8f6;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 6px;
    padding: 4px 8px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: all 0.14s ease;
  }
  button.hud-btn:hover {
    background: rgba(77, 243, 255, 0.18);
    border-color: var(--hud-accent);
    color: #ffffff;
  }
  button.hud-btn.is-active {
    background: rgba(77, 243, 255, 0.26);
    border-color: var(--hud-accent);
    color: #ffffff;
    box-shadow: 0 0 10px rgba(77, 243, 255, 0.38);
  }
  button.hud-btn.audio-active {
    background: rgba(56, 255, 179, 0.22);
    border-color: var(--hud-ok);
    color: #e6fff5;
    box-shadow: 0 0 10px rgba(56, 255, 179, 0.38);
  }
  button.hud-btn.blast-btn {
    background: rgba(255, 62, 127, 0.2);
    border-color: rgba(255, 62, 127, 0.6);
    color: #ffd6e5;
  }
  button.hud-btn.blast-btn:hover {
    background: rgba(255, 62, 127, 0.38);
    border-color: #ff6a9c;
    color: #ffffff;
    box-shadow: 0 0 12px rgba(255, 62, 127, 0.5);
  }
  .fx-label {
    color: #9dc6d8;
    font-size: 10px;
    letter-spacing: 0.5px;
    margin-right: 2px;
  }
  input[type="range"].fx-slider {
    width: 66px;
    accent-color: var(--hud-accent);
    cursor: pointer;
  }
  #toastMsg {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    background: rgba(10, 18, 26, 0.94);
    border: 1px solid var(--hud-accent);
    color: #e9fbff;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 11px;
    letter-spacing: 0.5px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.22s ease;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.65);
  }
  #toastMsg.visible { opacity: 1; }
</style>
</head>
<body>
<canvas id="glCanvas"></canvas>
<div id="toastMsg"></div>

<div id="controlDock" aria-label="LogBlaster Shader and Audio Controls">
  <div class="dock-group">
    <button class="hud-btn is-active" data-preset="0" title="Hotkey: 1">1 CRT</button>
    <button class="hud-btn" data-preset="1" title="Hotkey: 2">2 CYBER</button>
    <button class="hud-btn" data-preset="2" title="Hotkey: 3">3 RADIO SCOPE</button>
    <button class="hud-btn" data-preset="3" title="Hotkey: 4">4 ARCADE</button>
  </div>
  <div class="dock-group">
    <button class="hud-btn" id="btnSynth" title="Procedural Log-Reactive Telemetry Synth + Audio FFT (Hotkey: M)">SYNTH: OFF</button>
    <button class="hud-btn" id="btnAudioIn" title="Click: Capture System/Tab Audio | Shift+Click: Mic Input | Drop audio file anywhere (Hotkey: A)">AUDIO IN: OFF</button>
  </div>
  <div class="dock-group">
    <button class="hud-btn" id="btnTint" title="Cycle Phosphor Palette (Hotkey: T)">TINT: AUTO</button>
    <span class="fx-label">FX</span>
    <input type="range" id="fxSlider" class="fx-slider" min="0" max="160" value="100" title="GPU Shader Intensity (0% crisp raw -> 160% overdrive)" />
  </div>
  <div class="dock-group">
    <button class="hud-btn" id="btnFontDown" title="Smaller Log Text (Hotkey: -)">A-</button>
    <button class="hud-btn" id="btnFontUp" title="Larger Log Text (Hotkey: +)">A+</button>
    <button class="hud-btn" id="btnPause" title="Pause / Resume Auto-Scroll (Hotkey: Space)">LIVE</button>
  </div>
  <div class="dock-group">
    <button class="hud-btn blast-btn" id="btnTestBlast" title="Fire a synthetic ComfyUI log storm to test GPU shaders & audio (Hotkey: B)">TEST BLAST</button>
    <button class="hud-btn" id="btnCopy" title="Copy plain-text logs to clipboard">COPY</button>
    <button class="hud-btn" id="btnFullscreen" title="Toggle Fullscreen (Hotkey: F)">FULL</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // =========================================================================
  // 1. STATE, RING BUFFER, AUDIO-REACTIVE FFT & TELEMETRY
  // =========================================================================
  const MAX_LINES = 3500;
  const SPECTRUM_BINS = 48;
  const WAVE_SAMPLES = 160;
  const AUDIO_TEX_WIDTH = 256; // 256x2 R8 texture: row 0 = waveform, row 1 = FFT

  const PRESET_NAMES = [
    "RETRO CRT PHOSPHOR",
    "CYBERPUNK GLITCH // MATRIX",
    "VINTAGE RADIO OSCILLOSCOPE",
    "ARCADE NEON // SYNTHWAVE",
  ];
  const TINT_NAMES = ["AUTO", "AMBER P3", "GREEN P31", "ICE CYAN"];

  const params = new URLSearchParams(location.search);
  const preferHighGpu = params.get("gpu") === "high";

  const state = {
    preset: Number(localStorage.getItem("logblaster.preset") || 0) % 4,
    tintMode: Number(localStorage.getItem("logblaster.tint") || 0) % 4,
    fxIntensity: Number(localStorage.getItem("logblaster.fx") ?? 100) / 100.0,
    fontSize: Math.min(22, Math.max(11, Number(localStorage.getItem("logblaster.fontSize") || 14))),
    paused: false,
    scrollBackLines: 0,

    // Live ComfyUI connection + execution state
    wsConnected: false,
    clientId: "logblaster-" + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)),
    runState: "IDLE",
    runStartMs: 0,
    lastElapsedSec: 0,
    activeNodeId: null,
    activeNodeTitle: "Waiting for workflow...",
    nodeTitleMap: new Map(),
    stepVal: 0,
    stepMax: 0,
    stepRateSmooth: 0,
    lastStepMs: 0,

    // Log stream ring buffer
    lines: [],
    lineCounter: 0,
    partialCrActive: false,

    // Kinetic & GPU reactive uniforms
    charsThisSec: 0,
    linesThisSec: 0,
    cpsDisplay: 0,
    lpsDisplay: 0,
    blastRate: 0.0,
    stepPulse: 0.0,
    nodePulse: 0.0,
    glitchBurst: 0.0,
    flashPulse: 0.0,
    degaussWobble: 0.0,
    shockwaveTime: -10.0,
    shockwaveCenter: [0.5, 0.5],
    smoothScrollPx: 0.0,

    // Audio-reactive state (Web Audio API AnalyserNode + Procedural Synth)
    synthEnabled: false,
    audioInMode: "OFF", // OFF | SYSTEM | MIC | FILE
    audioActive: false,
    audioBass: 0.0,     // 20-160 Hz smoothed 0..1.5
    audioMid: 0.0,      // 160-2400 Hz smoothed 0..1.5
    audioHigh: 0.0,     // 2.4-12 kHz smoothed 0..1.5
    bassAvg: 0.12,
    lastBeatMs: 0,
    audioTexBytes: new Uint8Array(AUDIO_TEX_WIDTH * 2),

    // Real-time character/audio spectrum & waveform for 2D HUD deck
    spectrum: new Float32Array(SPECTRUM_BINS),
    spectrumPeak: new Float32Array(SPECTRUM_BINS),
    waveform: new Float32Array(WAVE_SAMPLES),
    waveWriteIdx: 0,

    // Hardware telemetry
    gpuTelemetry: {
      available: false,
      gpu_name: "Detecting GPU...",
      gpu_util: 0,
      vram_used_mib: 0,
      vram_total_mib: 0,
      temp_c: 0,
      power_w: 0,
    },
    shaderRendererName: "WebGL2 GPU",
    fps: 60,
  };

  // Initialize neutral centerline waveform (128 = 0.0 in unsigned byte)
  state.audioTexBytes.fill(128, 0, AUDIO_TEX_WIDTH);

  // =========================================================================
  // 2. ZERO-OVERHEAD WEB AUDIO FFT + PROCEDURAL LOG-REACTIVE SYNTH ENGINE
  // =========================================================================
  let audioCtx = null;
  let analyser = null;
  let synthMasterGain = null;
  let droneOsc = null;
  let droneGain = null;
  let externalStream = null;
  let externalSourceNode = null;
  let fileAudioEl = null;
  let fileMediaNode = null;
  let fftBuf = null;
  let timeBuf = null;
  let lastTickSoundMs = 0;

  function ensureAudioGraph() {
    if (audioCtx) {
      if (audioCtx.state === "suspended") audioCtx.resume();
      return;
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;

    audioCtx = new Ctx();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512; // 256 frequency bins — native SIMD C++, ~0.04% CPU
    analyser.smoothingTimeConstant = 0.74;
    fftBuf = new Uint8Array(analyser.frequencyBinCount);
    timeBuf = new Uint8Array(analyser.frequencyBinCount);

    synthMasterGain = audioCtx.createGain();
    synthMasterGain.gain.value = 0.24;
    synthMasterGain.connect(analyser);
    analyser.connect(audioCtx.destination);

    // Subtle warm analog carrier hum that swells gently during active blasts
    droneOsc = audioCtx.createOscillator();
    droneOsc.type = "triangle";
    droneOsc.frequency.value = 58.0;
    const droneFilter = audioCtx.createBiquadFilter();
    droneFilter.type = "lowpass";
    droneFilter.frequency.value = 150.0;
    droneGain = audioCtx.createGain();
    droneGain.gain.value = 0.0;
    droneOsc.connect(droneFilter);
    droneFilter.connect(droneGain);
    droneGain.connect(synthMasterGain);
    droneOsc.start();
  }

  function playSynthTick(kind, energy) {
    if (!state.synthEnabled || !audioCtx || !synthMasterGain) return;
    const nowMs = performance.now();
    // Rate-limit rapid log bursts to ~30 ticks/sec for smooth sci-fi mainframe chatter
    if (kind === "normal" && nowMs - lastTickSoundMs < 34) return;
    lastTickSoundMs = nowMs;

    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    if (kind === "error") {
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(210, t);
      osc.frequency.linearRampToValueAtTime(115, t + 0.22);
      gain.gain.setValueAtTime(0.32, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
      osc.connect(gain);
      gain.connect(synthMasterGain);
      osc.start(t);
      osc.stop(t + 0.25);
    } else if (kind === "complete") {
      // Warm retro-broadcast completion triad arpeggio
      const notes = [261.63, 392.0, 587.33, 659.25];
      notes.forEach((freq, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = "sine";
        const st = t + idx * 0.055;
        o.frequency.setValueAtTime(freq, st);
        g.gain.setValueAtTime(0.18, st);
        g.gain.exponentialRampToValueAtTime(0.001, st + 0.36);
        o.connect(g);
        g.connect(synthMasterGain);
        o.start(st);
        o.stop(st + 0.38);
      });
    } else if (kind === "shock") {
      // Deep cathode/sonar thump on node switch or shockwave
      osc.type = "sine";
      osc.frequency.setValueAtTime(125, t);
      osc.frequency.exponentialRampToValueAtTime(36, t + 0.24);
      gain.gain.setValueAtTime(0.38, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
      osc.connect(gain);
      gain.connect(synthMasterGain);
      osc.start(t);
      osc.stop(t + 0.27);
    } else if (kind === "progress") {
      const pct = state.stepMax > 0 ? state.stepVal / state.stepMax : 0.5;
      osc.type = "triangle";
      osc.frequency.setValueAtTime(160 + pct * 260, t);
      osc.frequency.exponentialRampToValueAtTime(95 + pct * 140, t + 0.065);
      gain.gain.setValueAtTime(0.16, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
      osc.connect(gain);
      gain.connect(synthMasterGain);
      osc.start(t);
      osc.stop(t + 0.075);
    } else {
      // Crisp soft CRT telemetry data tick
      osc.type = "sine";
      const pitch = 520 + ((state.lineCounter * 73) % 440) + energy * 180;
      osc.frequency.setValueAtTime(pitch, t);
      osc.frequency.exponentialRampToValueAtTime(pitch * 0.55, t + 0.024);
      gain.gain.setValueAtTime(0.065, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.028);
      osc.connect(gain);
      gain.connect(synthMasterGain);
      osc.start(t);
      osc.stop(t + 0.03);
    }
  }

  function disconnectExternalAudio() {
    if (externalSourceNode) {
      try { externalSourceNode.disconnect(); } catch (_) {}
      externalSourceNode = null;
    }
    if (externalStream) {
      externalStream.getTracks().forEach((tr) => tr.stop());
      externalStream = null;
    }
    if (fileAudioEl) {
      fileAudioEl.pause();
    }
    state.audioInMode = "OFF";
  }

  async function toggleExternalAudio(useMic = false) {
    if (state.audioInMode !== "OFF") {
      disconnectExternalAudio();
      state.audioActive = state.synthEnabled;
      syncControlsUI();
      showToast("EXTERNAL AUDIO INPUT DISCONNECTED");
      return;
    }

    ensureAudioGraph();
    if (!audioCtx || !analyser) {
      showToast("WEB AUDIO UNAVAILABLE");
      return;
    }

    try {
      let stream = null;
      if (useMic) {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
          video: false,
        });
        state.audioInMode = "MIC";
      } else {
        // System / Tab loopback audio capture (Windows Edge/Chrome supports "Share system audio")
        stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
        });
        // Immediately stop the video track so zero GPU/CPU is spent capturing screen pixels!
        stream.getVideoTracks().forEach((vt) => vt.stop());
        if (stream.getAudioTracks().length === 0) {
          showToast("TIP: Tick 'Also share system audio' in the picker (or Shift+Click for Mic)");
          return;
        }
        state.audioInMode = "SYS";
      }

      externalStream = stream;
      externalSourceNode = audioCtx.createMediaStreamSource(stream);
      // Connect external capture ONLY to analyser (not destination) so it never double-echoes!
      externalSourceNode.connect(analyser);
      stream.getAudioTracks()[0].addEventListener("ended", () => {
        disconnectExternalAudio();
        state.audioActive = state.synthEnabled;
        syncControlsUI();
      });

      state.audioActive = true;
      syncControlsUI();
      showToast(`AUDIO REACTIVE LIVE (${state.audioInMode} FFT)`);
    } catch (_) {
      showToast("AUDIO CAPTURE CANCELLED (Shift+Click AUDIO IN for Mic, or use SYNTH)");
    }
  }

  // Drag & drop any .wav / .mp3 / .mp4 file onto the HUD to play & visualize it!
  window.addEventListener("dragover", (ev) => ev.preventDefault());
  window.addEventListener("drop", (ev) => {
    ev.preventDefault();
    const file = ev.dataTransfer?.files?.[0];
    if (!file) return;
    ensureAudioGraph();
    disconnectExternalAudio();
    if (!fileAudioEl) {
      fileAudioEl = new Audio();
      fileAudioEl.crossOrigin = "anonymous";
    }
    fileAudioEl.src = URL.createObjectURL(file);
    fileAudioEl.loop = false;
    if (!fileMediaNode && audioCtx) {
      fileMediaNode = audioCtx.createMediaElementSource(fileAudioEl);
      fileMediaNode.connect(analyser);
    }
    fileAudioEl.play();
    state.audioInMode = "FILE";
    state.audioActive = true;
    syncControlsUI();
    ingestLogChunk(`[LogBlaster:SHOCKWAVE] >>> AUDIO-REACTIVE PLAYBACK: ${file.name} <<<\n`);
    showToast(`PLAYING & VISUALIZING: ${file.name}`);
  });

  function updateAudioAnalysis(nowMs, dtSec) {
    state.audioActive = state.synthEnabled || state.audioInMode !== "OFF";

    if (state.synthEnabled && droneGain && audioCtx) {
      const targetDrone = Math.min(0.18, state.blastRate * 0.11 + (state.runState === "BLASTING" ? 0.045 : 0.0));
      droneGain.gain.setTargetAtTime(targetDrone, audioCtx.currentTime, 0.08);
      if (droneOsc) {
        droneOsc.frequency.setTargetAtTime(55 + state.blastRate * 28, audioCtx.currentTime, 0.1);
      }
    } else if (droneGain && audioCtx) {
      droneGain.gain.setTargetAtTime(0.0, audioCtx.currentTime, 0.05);
    }

    if (!state.audioActive || !analyser || !fftBuf || !timeBuf) {
      // Smoothly decay audio uniforms and synthesize procedural log-driven scope texture
      state.audioBass = Math.max(0.0, state.audioBass - dtSec * 2.5);
      state.audioMid = Math.max(0.0, state.audioMid - dtSec * 2.5);
      state.audioHigh = Math.max(0.0, state.audioHigh - dtSec * 2.5);
      for (let i = 0; i < AUDIO_TEX_WIDTH; i++) {
        const wIdx = (state.waveWriteIdx + Math.floor((i / AUDIO_TEX_WIDTH) * WAVE_SAMPLES)) % WAVE_SAMPLES;
        const synthWave = state.waveform[wIdx] * 0.55 + Math.sin(i * 0.11 - nowMs * 0.007) * (0.06 + state.blastRate * 0.18);
        state.audioTexBytes[i] = Math.max(0, Math.min(255, Math.round(128 + synthWave * 115)));
        const sBin = Math.min(SPECTRUM_BINS - 1, Math.floor((i / AUDIO_TEX_WIDTH) * SPECTRUM_BINS));
        state.audioTexBytes[AUDIO_TEX_WIDTH + i] = Math.max(0, Math.min(255, Math.round(state.spectrum[sBin] * 210)));
      }
      return;
    }

    analyser.getByteFrequencyData(fftBuf);
    analyser.getByteTimeDomainData(timeBuf);

    // Copy directly into 256x2 GPU audio texture buffer
    for (let i = 0; i < AUDIO_TEX_WIDTH; i++) {
      state.audioTexBytes[i] = timeBuf[i];
      state.audioTexBytes[AUDIO_TEX_WIDTH + i] = fftBuf[i];
    }

    // Compute Bass (bins 1..8 ~ 40-350Hz), Mid (bins 9..48 ~ 380-2.1kHz), High (bins 49..140 ~ 2.2-6.5kHz)
    let bSum = 0, mSum = 0, hSum = 0;
    for (let i = 1; i <= 8; i++) bSum += fftBuf[i];
    for (let i = 9; i <= 48; i++) mSum += fftBuf[i];
    for (let i = 49; i <= 140; i++) hSum += fftBuf[i];

    const instBass = (bSum / (8 * 255)) * 1.45;
    const instMid = (mSum / (40 * 255)) * 1.55;
    const instHigh = (hSum / (92 * 255)) * 1.75;

    state.audioBass = state.audioBass * 0.55 + instBass * 0.45;
    state.audioMid = state.audioMid * 0.55 + instMid * 0.45;
    state.audioHigh = state.audioHigh * 0.50 + instHigh * 0.50;

    // Real-time beat-drop detector -> fires radial GPU shockwave through the log text!
    state.bassAvg = state.bassAvg * 0.94 + instBass * 0.06;
    if (instBass > 0.36 && instBass > state.bassAvg * 1.42 && (nowMs - state.lastBeatMs) > 240) {
      state.lastBeatMs = nowMs;
      triggerShockwave(0.3 + Math.random() * 0.4, 0.35 + Math.random() * 0.3);
    }

    // Drive the 48-band HUD spectrum & waveform directly from live audio FFT + log energy!
    for (let b = 0; b < SPECTRUM_BINS; b++) {
      const fftIdx = Math.min(200, Math.floor(Math.pow(b / SPECTRUM_BINS, 1.45) * 180) + 1);
      const fftNorm = (fftBuf[fftIdx] / 255) * 1.22;
      state.spectrum[b] = Math.max(state.spectrum[b], fftNorm);
    }
    for (let s = 0; s < WAVE_SAMPLES; s++) {
      const tIdx = Math.floor((s / WAVE_SAMPLES) * AUDIO_TEX_WIDTH);
      state.waveform[s] = (timeBuf[tIdx] - 128) / 128.0;
    }
    state.waveWriteIdx = 0;
  }

  // =========================================================================
  // 3. TOAST & UI CONTROLS
  // =========================================================================
  const toastEl = document.getElementById("toastMsg");
  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("visible");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("visible"), 1800);
  }

  const presetBtns = Array.from(document.querySelectorAll("[data-preset]"));
  const btnSynth = document.getElementById("btnSynth");
  const btnAudioIn = document.getElementById("btnAudioIn");
  const btnTint = document.getElementById("btnTint");
  const fxSlider = document.getElementById("fxSlider");
  const btnPause = document.getElementById("btnPause");

  function syncControlsUI() {
    presetBtns.forEach((b) => {
      b.classList.toggle("is-active", Number(b.dataset.preset) === state.preset);
    });
    btnSynth.textContent = state.synthEnabled ? "SYNTH: ON" : "SYNTH: OFF";
    btnSynth.classList.toggle("audio-active", state.synthEnabled);

    btnAudioIn.textContent = `AUDIO IN: ${state.audioInMode}`;
    btnAudioIn.classList.toggle("audio-active", state.audioInMode !== "OFF");

    btnTint.textContent = "TINT: " + TINT_NAMES[state.tintMode];

    btnPause.textContent = state.paused
      ? (state.scrollBackLines > 0 ? `PAUSED (-${state.scrollBackLines})` : "PAUSED")
      : "LIVE";
    btnPause.classList.toggle("is-active", state.paused);
  }

  function setPreset(idx) {
    state.preset = ((idx % 4) + 4) % 4;
    localStorage.setItem("logblaster.preset", String(state.preset));
    state.nodePulse = Math.max(state.nodePulse, 0.55);
    syncControlsUI();
    showToast(`SHADER ${state.preset + 1}: ${PRESET_NAMES[state.preset]}`);
  }

  presetBtns.forEach((b) => {
    b.addEventListener("click", () => setPreset(Number(b.dataset.preset)));

  btnSynth.addEventListener("click", () => {
    ensureAudioGraph();
    state.synthEnabled = !state.synthEnabled;
    state.audioActive = state.synthEnabled || state.audioInMode !== "OFF";
    syncControlsUI();
    if (state.synthEnabled) {
      playSynthTick("shock", 0.8);
      showToast("LOG-REACTIVE TELEMETRY SYNTH + FFT ENABLED");
    } else {

  btnAudioIn.addEventListener("click", (ev) => {

  btnTint.addEventListener("click", () => {

    localStorage.setItem("logblaster.tint", String(state.tintMode));

    showToast(`PALETTE: ${TINT_NAMES[state.tintMode]}`);

  fxSlider.addEventListener("input", () => {

  document.getElementById("btnFontDown").addEventListener("click", () => {

    localStorage.setItem("logblaster.fontSize", String(state.fontSize));

  document.getElementById("btnFontUp").addEventListener("click", () => {

    localStorage.setItem("logblaster.fontSize", String(state.fontSize));
    showToast(`FONT SIZE: ${state.fontSize}px`);

  btnPause.addEventListener("click", () => {

  document.getElementById("btnCopy").addEventListener("click", async () => {

  window.addEventListener("wheel", (ev) => {
    const deltaLines = Math.sign(ev.deltaY) * 4;
    if (deltaLines < 0) {
      state.paused = true;
      state.scrollBackLines = Math.min(
        Math.max(0, state.lines.length - 5),
        state.scrollBackLines - deltaLines
      );
    } else if (state.scrollBackLines > 0) {
      state.scrollBackLines = Math.max(0, state.scrollBackLines - deltaLines);
      if (state.scrollBackLines === 0) state.paused = false;
    }
    syncControlsUI();

  window.addEventListener("keydown", (ev) => {
    if (ev.target && ev.target.tagName === "INPUT") return;
    if (ev.key === "1") setPreset(0);
    else if (ev.key === "2") setPreset(1);
    else if (ev.key === "3") setPreset(2);
    else if (ev.key === "4") setPreset(3);
    else if (ev.key === "m" || ev.key === "M") btnSynth.click();
    else if (ev.key === "a" || ev.key === "A") toggleExternalAudio(Boolean(ev.shiftKey));
    else if (ev.key === "t" || ev.key === "T") btnTint.click();
    else if (ev.key === " ") { ev.preventDefault(); btnPause.click(); }
    else if (ev.key === "-" || ev.key === "_") document.getElementById("btnFontDown").click();
    else if (ev.key === "=" || ev.key === "+") document.getElementById("btnFontUp").click();
    else if (ev.key === "f" || ev.key === "F") document.getElementById("btnFullscreen").click();
    else if (ev.key === "b" || ev.key === "B") startTestBlast();

  syncControlsUI();

  // =========================================================================
  // 4. ANSI + SEMANTIC LOG PARSER & SIGNAL ANALYZER
  // =========================================================================
  const ANSI_16 = {
    30: "#586e75", 31: "#ff4d6d", 32: "#38ffb3", 33: "#ffc845",
    34: "#52b7ff", 35: "#ff66d9", 36: "#4df3ff", 37: "#e6f4ff",
    90: "#7a93a6", 91: "#ff6b86", 92: "#69ffca", 93: "#ffe066",
    94: "#80cbff", 95: "#ff8ce6", 96: "#88f8ff", 97: "#ffffff",
  };

  function triggerShockwave(cx = 0.5, cy = 0.48) {
    state.shockwaveTime = performance.now() * 0.001;
    state.shockwaveCenter = [cx, cy];
  }

  function feedSignalAnalyzer(text, energyBoost, kind) {
    const len = text.length;
    if (!len) return;
    state.charsThisSec += len;
    state.blastRate = Math.min(1.6, state.blastRate + Math.min(0.45, len * 0.0022) + energyBoost * 0.18);
    playSynthTick(kind, energyBoost);

    let waveAcc = 0;
    const stride = Math.max(1, Math.floor(len / 48));
    for (let i = 0; i < len; i += stride) {
      const code = text.charCodeAt(i);
      let bin = 0;
      if (code >= 48 && code <= 57) {
        bin = 24 + (code - 48);
      } else if (code >= 65 && code <= 90) {
        bin = 2 + ((code - 65) % 13);
      } else if (code >= 97 && code <= 122) {
        bin = 15 + ((code - 97) % 9);
      } else if (code > 127) {
        bin = 40 + (code % 8);
      } else {
        bin = 34 + (code % 6);
      }
      state.spectrum[bin] = Math.min(1.35, state.spectrum[bin] + 0.16 + energyBoost * 0.14);
      waveAcc += ((code & 31) - 15.5) / 15.5;
    }
    state.spectrum[0] = Math.min(1.35, state.spectrum[0] + 0.25 + energyBoost * 0.3);
    state.spectrum[1] = Math.min(1.35, state.spectrum[1] + 0.20 + energyBoost * 0.25);

    if (!state.audioActive) {
      const sampleCount = Math.ceil(len / stride);
      const normWave = Math.max(-1, Math.min(1, (waveAcc / Math.max(1, sampleCount)) * (0.65 + state.blastRate * 0.6)));
      state.waveform[state.waveWriteIdx] = normWave;
      state.waveWriteIdx = (state.waveWriteIdx + 1) % WAVE_SAMPLES;
    }
  }

  function classifySemanticLine(plain) {
    if (/\[LogBlaster:SHOCKWAVE\]/i.test(plain)) {
      triggerShockwave(0.5, 0.5);
      state.flashPulse = Math.max(state.flashPulse, 0.7);
      return { color: "#4df3ff", kind: "shock", energy: 0.9 };
    }
    if (/\[LogBlaster:GLITCH_BURST\]/i.test(plain)) {
      state.glitchBurst = 1.0;
      return { color: "#ff3e7f", kind: "error", energy: 1.0 };
    }
    if (/\[LogBlaster:PHOSPHOR_FLASH\]/i.test(plain)) {
      state.flashPulse = 1.0;
      return { color: "#fff3a1", kind: "complete", energy: 0.95 };
    }
    if (/(\[ERROR\]|Traceback|Exception:|RenderError|CUDA out of memory|\bFAILED\b)/i.test(plain)) {
      state.glitchBurst = Math.max(state.glitchBurst, 0.85);
      return { color: "#ff4769", kind: "error", energy: 1.0 };
    }
    if (/(\[WARNING\]|\bWARN\b|UserWarning|FutureWarning)/i.test(plain)) {
      return { color: "#ffc94a", kind: "warn", energy: 0.45 };
    }
    if (/(Prompt executed in|obs_publish OK|execution_success|=== COMPLETE ===)/i.test(plain)) {
      triggerShockwave(0.5, 0.42);
      state.flashPulse = Math.max(state.flashPulse, 0.85);
      return { color: "#4dffb5", kind: "complete", energy: 0.95 };
    }
    if (/(\d+%\|[█▉▊▋▌▍▎▏#=\- ]+\||\bit\/s\b|\bs\/it\b|\btok\/s\b)/.test(plain)) {
      state.stepPulse = Math.max(state.stepPulse, 0.55);
      return { color: "#7ef9ff", kind: "progress", energy: 0.65 };
    }
    if (/(\[OldTimeRadio\]|\[OTR\]|\[LogBlaster\]|\[launch\])/i.test(plain)) {
      return { color: "#5ce6ff", kind: "badge", energy: 0.4 };
    }
    return { color: "#cde8f6", kind: "normal", energy: 0.12 };
  }

  function tokenizeSpans(rawSegment, baseColor) {
    const spans = [];
    const ansiRegex = /\x1b\[([0-9;]*)m/g;
    let lastIdx = 0;
    let curColor = null;
    let bold = false;
    let match;

    const pushHighlightedChunk = (chunk, explicitColor) => {
      if (!chunk) return;
      if (explicitColor) {
        spans.push({ text: chunk, color: explicitColor, hot: bold });
        return;
      }
      const tokRe = /(\[[^\]]{2,28}\]|\d+%\|[^|]+\||(?:\b\d+(?:\.\d+)?(?:it\/s|s\/it|tok\/s|MiB|GiB|MB|GB|ms|s|%)\b))/g;
      let tLast = 0;
      let tm;
      while ((tm = tokRe.exec(chunk)) !== null) {
        if (tm.index > tLast) {
          spans.push({ text: chunk.slice(tLast, tm.index), color: baseColor, hot: false });
        }
        const tok = tm[0];
        let tokColor = "#ffffff";
        if (tok.startsWith("[")) {
          if (/error|fail/i.test(tok)) tokColor = "#ff5c7c";
          else if (/warn/i.test(tok)) tokColor = "#ffd15c";
          else tokColor = "#59f3ff";
        } else if (tok.includes("%|")) {
          tokColor = "#7affd4";
        } else {
          tokColor = "#ffe680";
        }
        spans.push({ text: tok, color: tokColor, hot: true });
        tLast = tm.index + tok.length;
      }
      if (tLast < chunk.length) {
        spans.push({ text: chunk.slice(tLast), color: baseColor, hot: false });
      }
    };

    while ((match = ansiRegex.exec(rawSegment)) !== null) {
      if (match.index > lastIdx) {
        pushHighlightedChunk(rawSegment.slice(lastIdx, match.index), curColor);
      }
      const codes = (match[1] || "0").split(";").map(Number);
      for (let i = 0; i < codes.length; i++) {
        const c = codes[i];
        if (c === 0) { curColor = null; bold = false; }
        else if (c === 1) { bold = true; }
        else if (ANSI_16[c]) { curColor = ANSI_16[c]; }
        else if (c === 38 && codes[i + 1] === 5 && codes[i + 2] !== undefined) {
          const n = codes[i + 2];
          curColor = `hsl(${(n * 47) % 360}, 88%, 68%)`;
          i += 2;
        } else if (c === 38 && codes[i + 1] === 2 && codes[i + 4] !== undefined) {
          curColor = `rgb(${codes[i + 2]},${codes[i + 3]},${codes[i + 4]})`;
          i += 4;
        }
      }
      lastIdx = match.index + match[0].length;
    }
    if (lastIdx < rawSegment.length) {
      pushHighlightedChunk(rawSegment.slice(lastIdx), curColor);
    }
    return spans.length ? spans : [{ text: rawSegment, color: baseColor, hot: false }];
  }

  function formatTime(isoOrNow) {
    const d = isoOrNow ? new Date(isoOrNow) : new Date();
    if (Number.isNaN(d.getTime())) return new Date().toTimeString().slice(0, 8);
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    const ss = String(d.getSeconds()).padStart(2, "0");
    return `${hh}:${mm}:${ss}`;
  }

  function appendOrUpdateLine(rawLine, isoTime, replaceLast, silentBackfill = false) {
    const expanded = rawLine.replace(/\t/g, "  ");
    const plain = expanded.replace(/\x1b\[[0-9;]*[A-Za-z]/g, "");
    if (!plain.trim() && replaceLast) return;

    const sem = classifySemanticLine(plain);
    const spans = tokenizeSpans(expanded, sem.color);
    const now = performance.now();
    const entry = {
      id: ++state.lineCounter,
      ts: silentBackfill ? now - 2000 : now,
      timeStr: formatTime(isoTime),
      raw: plain,
      spans,
      kind: sem.kind,
      energy: sem.energy,
    };

    if (replaceLast && state.lines.length > 0) {
      entry.ts = now - 110;
      state.lines[state.lines.length - 1] = entry;
    } else {
      state.lines.push(entry);
      if (!silentBackfill) {
        state.linesThisSec++;
        state.smoothScrollPx += state.fontSize * 1.38;
      }
      if (state.lines.length > MAX_LINES) {
        state.lines.splice(0, state.lines.length - MAX_LINES);
      }
    }
    if (!silentBackfill) {
      feedSignalAnalyzer(plain, sem.energy, sem.kind);
    }
  }

  function ingestLogChunk(text, isoTime, silentBackfill = false) {
    if (typeof text !== "string" || !text.length) return;
    const norm = text.replace(/\r\n/g, "\n");
    const newlineParts = norm.split("\n");

    for (let i = 0; i < newlineParts.length; i++) {
      const part = newlineParts[i];
      const isTrailingEmptyAfterLf = (i === newlineParts.length - 1 && part === "");
      if (isTrailingEmptyAfterLf) {
        state.partialCrActive = false;
        continue;
      }

      if (part.includes("\r")) {
        const crSegments = part.split("\r");
        for (let c = 0; c < crSegments.length; c++) {
          const seg = crSegments[c];
          if (seg === "" && c === 0) {
            state.partialCrActive = true;
            continue;
          }
          if (!seg) continue;
          const shouldReplace = state.partialCrActive || c > 0;
          appendOrUpdateLine(seg, isoTime, shouldReplace, silentBackfill);
          state.partialCrActive = true;
        }
      } else {
        appendOrUpdateLine(part, isoTime, state.partialCrActive, silentBackfill);
        state.partialCrActive = false;
      }

      if (i < newlineParts.length - 1) {
        state.partialCrActive = false;
      }
    }
  }

  // =========================================================================
  // 5. COMFYUI LIVE WEBSOCKET + LOG SUBSCRIPTION + BROADCAST CHANNEL
  // =========================================================================
  let ws = null;
  let reconnectTimer = null;

  async function backfillAndSubscribeLogs() {
    try {
      const rawRes = await fetch("/internal/logs/raw", { cache: "no-store" });
      if (rawRes.ok) {
        const data = await rawRes.json();
        if (Array.isArray(data?.entries) && state.lines.length <= 4) {
          for (const item of data.entries) {
            if (item && typeof item.m === "string") {
              ingestLogChunk(item.m, item.t, true);
            }
          }
          state.smoothScrollPx = 0;
          state.blastRate = 0.15;
        }
      }
    } catch (_) {}

    try {
      await fetch("/internal/logs/subscribe", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ clientId: state.clientId, enabled: true }),
      });
    } catch (_) {}
  }

  function connectComfySocket() {
    clearTimeout(reconnectTimer);
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl = `${proto}//${location.host}/ws?clientId=${encodeURIComponent(state.clientId)}`;

    try {
      ws = new WebSocket(wsUrl);
    } catch (_) {
      reconnectTimer = setTimeout(connectComfySocket, 2000);
      return;
    }

    ws.addEventListener("open", () => {
      state.wsConnected = true;
      ingestLogChunk("[LogBlaster] Connected to ComfyUI live log + event stream (/ws)\n");
      backfillAndSubscribeLogs();
    });

    ws.addEventListener("message", (ev) => {
      if (typeof ev.data !== "string") return;
      let msg;
      try {
        msg = JSON.parse(ev.data);
      } catch (_) {
        return;
      }
      const { type, data } = msg;
      if (type === "logs" && Array.isArray(data?.entries)) {
        for (const entry of data.entries) {
          if (entry && typeof entry.m === "string") {
            ingestLogChunk(entry.m, entry.t);
          }
        }
      } else if (type === "execution_start") {
        state.runState = "BLASTING";
        state.runStartMs = performance.now();
        state.stepVal = 0;
        state.stepMax = 0;
        state.degaussWobble = 1.0;
        state.flashPulse = 0.85;
        triggerShockwave(0.5, 0.25);
        ingestLogChunk(`[LogBlaster:SHOCKWAVE] >>> WORKFLOW EXECUTION STARTED (prompt ${String(data?.prompt_id || "").slice(0, 8)}) <<<\n`);
      } else if (type === "executing") {
        const nodeId = data?.node;
        if (nodeId === null || nodeId === undefined) {
          if (state.runState === "BLASTING") {
            state.runState = "COMPLETE";
            state.lastElapsedSec = (performance.now() - state.runStartMs) / 1000;
            state.activeNodeTitle = "Workflow Complete";
            state.flashPulse = 1.0;
            triggerShockwave(0.5, 0.5);
            playSynthTick("complete", 1.0);
          }
        } else {
          state.runState = "BLASTING";
          if (!state.runStartMs) state.runStartMs = performance.now();
          state.activeNodeId = String(nodeId);
          const knownTitle = state.nodeTitleMap.get(String(nodeId));
          state.activeNodeTitle = knownTitle ? `${knownTitle} (#${nodeId})` : `Node #${nodeId}`;
          state.nodePulse = 1.0;
          state.stepVal = 0;
          state.stepMax = 0;
          triggerShockwave(0.2 + Math.random() * 0.6, 0.35 + Math.random() * 0.3);
          playSynthTick("shock", 0.8);
        }
      } else if (type === "progress") {
        const now = performance.now();
        if (state.lastStepMs > 0 && data?.value > state.stepVal) {
          const dt = (now - state.lastStepMs) / 1000;
          if (dt > 0.005 && dt < 30) {
            const instRate = (data.value - state.stepVal) / dt;
            state.stepRateSmooth = state.stepRateSmooth > 0
              ? state.stepRateSmooth * 0.7 + instRate * 0.3
              : instRate;
          }
        }
        state.lastStepMs = now;
        state.stepVal = Number(data?.value || 0);
        state.stepMax = Number(data?.max || 0);
        state.stepPulse = 1.0;
        state.runState = "BLASTING";
      } else if (type === "execution_error") {
        state.runState = "ERROR";
        state.glitchBurst = 1.0;
        const errNode = data?.node_type || data?.node_id || "unknown";
        const errMsg = data?.exception_message || "Execution error";
        ingestLogChunk(`[ERROR] Node ${errNode}: ${errMsg}\n`);
      } else if (type === "execution_success") {
        state.runState = "COMPLETE";
        if (state.runStartMs) {
          state.lastElapsedSec = (performance.now() - state.runStartMs) / 1000;
        }
        state.flashPulse = 1.0;
        triggerShockwave(0.5, 0.5);
      }
    });

    ws.addEventListener("close", () => {
      state.wsConnected = false;
      reconnectTimer = setTimeout(connectComfySocket, 2200);
    });

    ws.addEventListener("error", () => {
      try { ws.close(); } catch (_) {}
    });
  }

  let bus = null;
  try {
    bus = new BroadcastChannel("comfy-logblaster-bus");
    bus.addEventListener("message", (ev) => {
      const m = ev.data;
      if (!m || typeof m !== "object") return;
      if (m.type === "ping") {
        bus.postMessage({ type: "pong", ts: Date.now() });
      } else if (m.type === "node_map" && m.nodes && typeof m.nodes === "object") {
        for (const [id, title] of Object.entries(m.nodes)) {
          state.nodeTitleMap.set(String(id), String(title));
        }
        if (state.activeNodeId && state.nodeTitleMap.has(state.activeNodeId)) {
          state.activeNodeTitle = `${state.nodeTitleMap.get(state.activeNodeId)} (#${state.activeNodeId})`;
        }
      } else if (m.type === "wake") {
        state.flashPulse = Math.max(state.flashPulse, 0.65);
      }
    });
    setInterval(() => {
      try { bus.postMessage({ type: "pong", ts: Date.now() }); } catch (_) {}
    }, 1500);
  } catch (_) {}

  async function pollTelemetry() {
    try {
      const res = await fetch("/logblaster/telemetry", { cache: "no-store" });
      if (res.ok) {
        const data = await res.json();
        if (data && typeof data === "object") {
          state.gpuTelemetry = data;
        }
      }
    } catch (_) {}
  }
  setInterval(pollTelemetry, 1000);
  pollTelemetry();

  setInterval(() => {
    state.cpsDisplay = state.charsThisSec;
    state.lpsDisplay = state.linesThisSec;
    state.charsThisSec = 0;
    state.linesThisSec = 0;
  }, 1000);

  // =========================================================================
  // 6. SYNTHETIC "TEST BLAST" DEMO GENERATOR (HOTKEY: B)
  // =========================================================================
  let demoTimers = [];
  function startTestBlast() {

    demoTimers = [];

    state.paused = false;
    state.scrollBackLines = 0;

    const script = [
      [0,    "[LogBlaster:SHOCKWAVE] >>> SYNTHETIC GPU SHADER TEST BLAST INITIATED <<<\n"],

        { step: s, max: 14, node: "KokoroTTS_Batch (#18)" },

    script.push([1820, "\n[OldTimeRadio] Audio LUFS check: -16.1 LUFS, true-peak -1.2 dBTP [PASS]\n"]);
    script.push([1960, "[LTX-Video] Stage 3/4: Two-stage IA2V latent diffusion (768x512 -> 1536x1024, 121 frames)\n", { shock: true, node: "OTR_VideoRenderBatch (#74)" }]);

    for (let s = 1; s <= 24; s++) {

      const filled = Math.round((s / 24) * 26);

      const rate = (5.8 + Math.sin(s * 0.5) * 0.4).toFixed(2);

    if (rightX > 360) {

        ctx.fillStyle = pal.primary || "#d2f0ff";

        ctx.fillText(`TMP  ${String(gt.temp_c).padStart(2, " ")}C | PWR ${gt.power_w}W`, rightX, 54);

        const gw = 250;
        ctx.fillStyle = "rgba(120, 170, 195, 0.24)";

      ctx.fillStyle = pal.dim;
      const fxGpuShort = state.shaderRendererName.slice(0, 27);
      ctx.fillText(`FX GPU: ${fxGpuShort} (${state.fps}fps)`, rightX, 82);
    }

    // --- MAIN BLASTING LOG TEXT VIEWPORT ---
    const logTop = headerH + 10;
    const logBottom = vh - 18;
    const availH = Math.max(60, logBottom - logTop);
    const fs = state.fontSize;
    const lineH = Math.round(fs * 1.42);
    const visibleCount = Math.max(3, Math.floor(availH / lineH));

    state.smoothScrollPx *= Math.pow(0.0008, dtSec);
    if (state.smoothScrollPx < 0.35 || state.paused) state.smoothScrollPx = 0;

    ctx.beginPath();
    ctx.rect(0, logTop, vw, availH + 6);
    ctx.clip();

    const total = state.lines.length;
    const endIdx = Math.max(0, total - state.scrollBackLines);
    const startIdx = Math.max(0, endIdx - visibleCount - 1);

    ctx.font = `${fs}px 'Cascadia Mono', 'JetBrains Mono', 'Consolas', monospace`;
    ctx.textBaseline = "alphabetic";

    const timeW = fs * 6.2;
    const textStartX = padX + 10 + timeW;

    for (let i = startIdx; i < endIdx; i++) {
      const line = state.lines[i];
      const rowFromBottom = (endIdx - 1) - i;
      const y = logBottom - 6 - rowFromBottom * lineH + state.smoothScrollPx;
      if (y < logTop - lineH || y > logBottom + lineH) continue;

      const ageMs = Math.max(0, nowMs - line.ts);
      const birthFlash = ageMs < 280 ? Math.pow(1.0 - ageMs / 280, 1.7) : 0.0;

      if (line.kind !== "normal" || birthFlash > 0.25) {

          line.kind === "error" ? "#ff3860" :
          line.kind === "warn" ? "#ffc845" :
          line.kind === "complete" || line.kind === "shock" ? "#38ffb3" :
          "#4df3ff"
        );
        ctx.fillStyle = birthFlash > 0.45 ? "#ffffff" : gutterColor;
        ctx.fillRect(padX, y - fs + 2, 3.5, fs + 1);
      }

      ctx.fillStyle = birthFlash > 0.55 ? pal.bright : pal.dim;
      ctx.fillText(line.timeStr, padX + 8, y);

      let curX = textStartX;
      for (let s = 0; s < line.spans.length; s++) {
        const sp = line.spans[s];
        if (!sp.text) continue;
        if (curX > vw - padX) break;

        if (birthFlash > 0.38) {
          ctx.fillStyle = "#ffffff";
        } else if (pal.primary) {
          ctx.fillStyle = sp.hot ? pal.bright : pal.primary;
        } else {
          ctx.fillStyle = sp.color;
        }

        if (sp.hot || birthFlash > 0.2) {
          ctx.font = `bold ${fs}px 'Cascadia Mono', 'JetBrains Mono', 'Consolas', monospace`;
        } else {
          ctx.font = `${fs}px 'Cascadia Mono', 'JetBrains Mono', 'Consolas', monospace`;
        }

        ctx.fillText(sp.text, curX, y);
        curX += ctx.measureText(sp.text).width;

      if (birthFlash > 0.15 && curX < vw - padX) {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(Math.min(vw - padX - 12, curX + 4), y - fs + 3, 8 * birthFlash, fs - 1);

      ctx.fillStyle = pal.bright;
      ctx.fillRect(padX + 8, logBottom - 2, fs * 0.65, 3);

  const VERT_SRC = `#version 300 es
precision highp float;
out vec2 v_uv;
void main() {
  vec2 pos = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);

  const FEEDBACK_FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 fragColor;

uniform sampler2D u_textTex;
uniform sampler2D u_prevTex;
uniform vec2 u_res;
uniform float u_time;
uniform int u_preset;
uniform float u_fx;
uniform float u_blastRate;
uniform float u_audioBass;

float hash11(float p) {
  p = fract(p * 0.1031);
  p *= p + 33.33;
  p *= p + p;
  return fract(p);
}

void main() {
  vec4 live = texture(u_textTex, v_uv);
  float fx = clamp(u_fx, 0.0, 1.6);

  if (fx < 0.02) {
    fragColor = vec4(live.rgb * live.a, live.a);
    return;
  }

  vec3 trail = vec3(0.0);
  float drive = clamp(u_blastRate + u_audioBass * 0.85, 0.0, 1.8);

  if (u_preset == 0) {
    vec3 prev = texture(u_prevTex, v_uv).rgb;
    float decay = mix(0.35, 0.78, clamp(fx + u_audioBass * 0.15, 0.0, 1.25));
    trail = prev * decay;
    vec3 currentLit = live.rgb * live.a;
    fragColor = vec4(max(trail, currentLit), live.a);
  } else if (u_preset == 1) {
    float colId = floor(v_uv.x * (u_res.x / 9.0));
    float colSpeed = (0.0022 + 0.0048 * hash11(colId + 7.13)) * (0.7 + drive * 0.75) * fx;
    vec2 dripUv = vec2(v_uv.x, min(0.999, v_uv.y + colSpeed));

    vec3 prevDrip = texture(u_prevTex, dripUv).rgb;
    vec4 srcAbove = texture(u_textTex, dripUv);

    float rainPulse = 0.84 + 0.16 * sin(u_time * 9.0 + colId * 3.7 + v_uv.y * 45.0);
    vec3 matrixTint = mix(vec3(0.10, 1.0, 0.58), vec3(0.25, 0.92, 1.0), hash11(colId * 3.1));

    vec3 spawnedWake = srcAbove.rgb * srcAbove.a * matrixTint * (0.52 + 0.22 * u_audioBass) * clamp(fx, 0.0, 1.35);
    trail = max(prevDrip * 0.875 * rainPulse, spawnedWake);
    vec3 currentLit = live.rgb * live.a;
    fragColor = vec4(max(trail * 0.88, currentLit), live.a);
  } else if (u_preset == 2) {
    vec3 prev = texture(u_prevTex, v_uv).rgb;
    vec3 p7Decay = vec3(0.58, 0.85, 0.73) * clamp(0.66 + 0.22 * fx, 0.0, 0.91);
    trail = prev * p7Decay;
    vec3 currentLit = live.rgb * live.a;
    fragColor = vec4(max(trail, currentLit), live.a);
  } else {
    vec2 center = vec2(0.5, 0.5);
    float zoomAmt = (0.0025 + 0.006 * clamp(drive, 0.0, 1.4)) * fx;
    vec2 zoomUv = center + (v_uv - center) * (1.0 - zoomAmt);
    vec3 prevZoom = texture(u_prevTex, clamp(zoomUv, vec2(0.001), vec2(0.999))).rgb;
    vec3 neonShift = vec3(prevZoom.r * 0.84, prevZoom.g * 0.72, prevZoom.b * 0.88);
    vec3 currentLit = live.rgb * live.a;
    fragColor = vec4(max(neonShift, currentLit), live.a);
  }
}
`;

  const COMPOSITE_FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 fragColor;

uniform sampler2D u_textTex;
uniform sampler2D u_feedbackTex;
uniform sampler2D u_audioTex; // 256x2 R8: row y=0.25 waveform, row y=0.75 FFT
uniform vec2 u_res;
uniform float u_time;
uniform int u_preset;
uniform float u_fx;
uniform float u_blastRate;
uniform float u_stepPulse;
uniform float u_nodePulse;
uniform float u_glitchBurst;
uniform float u_flashPulse;
uniform float u_degauss;
uniform float u_shockTime;
uniform vec2 u_shockCenter;
uniform float u_audioBass;
uniform float u_audioMid;
uniform float u_audioHigh;

float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

vec2 barrelWarp(vec2 uv, float amount) {
  vec2 cc = uv * 2.0 - 1.0;
  float r2 = dot(cc, cc);
  cc *= 1.0 + amount * r2 + (amount * 0.32) * r2 * r2;
  return cc * 0.5 + 0.5;
}

vec3 sampleBloom(sampler2D tex, vec2 uv, vec2 px, float radius) {
  vec3 acc = vec3(0.0);
  vec2 r1 = px * radius;
  vec2 r2 = px * radius * 2.35;

  acc += texture(tex, uv + vec2( r1.x,  0.0)).rgb * 0.16;
  acc += texture(tex, uv + vec2(-r1.x,  0.0)).rgb * 0.16;
  acc += texture(tex, uv + vec2( 0.0,  r1.y)).rgb * 0.16;
  acc += texture(tex, uv + vec2( 0.0, -r1.y)).rgb * 0.16;

  acc += texture(tex, uv + vec2( r2.x,  r2.y)).rgb * 0.09;
  acc += texture(tex, uv + vec2(-r2.x,  r2.y)).rgb * 0.09;
  acc += texture(tex, uv + vec2( r2.x, -r2.y)).rgb * 0.09;
  acc += texture(tex, uv + vec2(-r2.x, -r2.y)).rgb * 0.09;
  return acc;
}

void main() {
  float fx = clamp(u_fx, 0.0, 1.6);
  vec2 px = 1.0 / max(u_res, vec2(1.0));
  vec2 uv = v_uv;

  // Subtle bass-thump breathing zoom on heavy audio kicks
  if (u_audioBass > 0.05 && fx > 0.05) {
    float bassZoom = 1.0 - (u_audioBass * 0.0085 * min(fx, 1.3));
    uv = vec2(0.5) + (uv - vec2(0.5)) * bassZoom;
  }

  // CRT / Cabinet barrel curvature
  float warpStrength = 0.0;
  if (u_preset == 0) warpStrength = 0.056 * min(fx, 1.25);
  else if (u_preset == 2) warpStrength = 0.038 * min(fx, 1.2);
  else if (u_preset == 3) warpStrength = 0.048 * min(fx, 1.2);

  if (u_degauss > 0.01 && fx > 0.05) {
    float wob = sin(u_time * 42.0 + uv.y * 12.0) * 0.014 * u_degauss * fx;
    uv.x += wob;
    uv.y += cos(u_time * 35.0) * 0.006 * u_degauss * fx;
  }

  if (warpStrength > 0.0005) {
    uv = barrelWarp(uv, warpStrength);
  }

  if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
    float bezelDist = max(max(-uv.x, uv.x - 1.0), max(-uv.y, uv.y - 1.0));
    vec3 bezel = vec3(0.015, 0.02, 0.028) * exp(-bezelDist * 45.0);

  if (shockAge >= 0.0 && shockAge < 1.35 && fx > 0.05) {

    vec2 delta = (uv - u_shockCenter) * aspect;
    float dist = length(delta);
    float radius = shockAge * 1.15;
    float band = exp(-pow((dist - radius) * 26.0, 2.0)) * (1.0 - shockAge / 1.35);
    shockRing = band;
    float refractScale = (u_preset == 3 ? 0.026 : 0.012) * fx;
    vec2 dir = dist > 0.0001 ? normalize(delta) : vec2(0.0);
    uv -= (dir / aspect) * band * refractScale;
  }

  // Live audio waveform sample at this X/Y coordinate (-1..1)
  float waveAtX = (texture(u_audioTex, vec2(uv.x, 0.25)).r - 0.5) * 2.0;
  float waveAtY = (texture(u_audioTex, vec2(uv.y, 0.25)).r - 0.5) * 2.0;
  float fftAtX  = texture(u_audioTex, vec2(uv.x * 0.72, 0.75)).r;

  // Preset-specific UV displacement directly on log characters
  float sliceGlitch = 0.0;
  if (u_preset == 1 && fx > 0.05) {
    float activity = clamp(u_blastRate * 0.45 + u_nodePulse * 0.9 + u_glitchBurst * 1.4 + u_audioHigh * 0.75, 0.0, 1.9);
    float bandY = floor(uv.y * 34.0 + floor(u_time * 18.0));
    float rnd = hash12(vec2(bandY, floor(u_time * 22.0)));
    float threshold = 0.965 - 0.14 * activity * min(fx, 1.4);
    if (rnd > threshold) {
      sliceGlitch = (hash12(vec2(bandY * 1.7, u_time)) - 0.5) * 0.055 * fx * (0.4 + activity);
      uv.x = clamp(uv.x + sliceGlitch, 0.001, 0.999);
    }
  } else if (u_preset == 2 && fx > 0.05) {
    // Radio Oscilloscope: real audio pressure wave magnetically deflects the log text scanlines!
    float carrier = sin(uv.y * 55.0 - u_time * 7.5) * cos(uv.y * 19.0 + u_time * 4.2);
    float energy = (0.0006 + 0.0022 * clamp(u_blastRate, 0.0, 1.2) + 0.0024 * u_stepPulse) * fx;
    float audioDeflect = waveAtY * (0.0045 * clamp(u_audioMid + u_audioBass * 0.6, 0.0, 1.5)) * fx;
    uv.x = clamp(uv.x + carrier * energy + audioDeflect, 0.001, 0.999);
  } else if (u_glitchBurst > 0.05 && fx > 0.05) {
    float bandY = floor(uv.y * 28.0);
    float rnd = hash12(vec2(bandY, floor(u_time * 30.0)));
    if (rnd > 0.82) {
      uv.x = clamp(uv.x + (rnd - 0.9) * 0.08 * u_glitchBurst * fx, 0.001, 0.999);
    }
  }

  // Chromatic Aberration (reacts to audio treble + log blast velocity!)
  float chromaPx = 0.0;
  if (u_preset == 0) {
    float edge = length(uv - 0.5) * 1.5;
    chromaPx = (0.8 + 1.8 * edge + 2.5 * u_audioHigh) * fx;
  } else if (u_preset == 1) {
    chromaPx = (1.8 + 4.5 * clamp(u_blastRate, 0.0, 1.2) + 5.5 * u_audioHigh + 9.0 * abs(sliceGlitch) * 20.0 + 7.0 * u_glitchBurst) * fx;
  } else if (u_preset == 2) {
    chromaPx = (0.6 + 2.2 * u_stepPulse + 2.4 * u_audioHigh) * fx;
  } else {
    chromaPx = (1.5 + 8.0 * shockRing + 3.5 * u_nodePulse + 4.0 * u_audioBass) * fx;
  }

  vec2 cOff = vec2(px.x * chromaPx, 0.0);
  vec4 tL = texture(u_textTex, clamp(uv + cOff, vec2(0.0), vec2(1.0)));
  vec4 tC = texture(u_textTex, uv);
  vec4 tR = texture(u_textTex, clamp(uv - cOff, vec2(0.0), vec2(1.0)));

  vec3 crispGlyph = vec3(tL.r * tL.a, tC.g * tC.a, tR.b * tR.a);

  // Audio-bass reactive HDR Phosphor Bloom around log characters
  vec3 trail = texture(u_feedbackTex, uv).rgb;
  float bloomRad = (u_preset == 3 ? 2.8 : (u_preset == 0 ? 2.4 : 2.1)) * (0.6 + 0.6 * fx + 0.55 * u_audioBass);
  vec3 bloom = sampleBloom(u_feedbackTex, uv, px, bloomRad) * (0.65 + 0.65 * fx + 0.55 * u_audioBass);

  // Procedural GPU Backgrounds + Real-Time Audio Oscilloscope / FFT Fields
  vec3 bg = vec3(0.015, 0.022, 0.032);

  if (u_preset == 0) {
    float hum = 0.5 + 0.5 * sin(uv.y * 6.2831 - u_time * 1.9);
    bg = vec3(0.016, 0.020, 0.026) + vec3(0.008, 0.012, 0.015) * pow(hum, 4.0) * fx;
  } else if (u_preset == 1) {
    vec2 grid = abs(fract(uv * vec2(48.0, 28.0)) - 0.5);
    float gLine = smoothstep(0.48, 0.5, max(grid.x, grid.y));
    float laser = exp(-abs(uv.y - fract(-u_time * 0.18)) * 55.0);
    bg = vec3(0.010, 0.016, 0.024) + vec3(0.0, 0.045, 0.055) * gLine * min(fx, 1.0);
    bg += vec3(0.02, 0.10, 0.12) * laser * min(fx, 1.2);
    // Subtle background FFT skyline glow along bottom
    if (uv.y < fftAtX * 0.22 * min(fx, 1.3)) {
      bg += vec3(0.0, 0.06, 0.08) * (1.0 - uv.y / max(0.01, fftAtX * 0.22));
    }
  } else if (u_preset == 2) {
    // VINTAGE RADIO OSCILLOSCOPE — Etched Tektronix Graticule + TRUE LIVE AUDIO OSCILLOSCOPE BEAM!
    bg = vec3(0.008, 0.030, 0.022);
    vec2 div = uv * vec2(10.0, 8.0);
    vec2 fDiv = abs(fract(div) - 0.5);
    float majorGrid = 1.0 - smoothstep(0.0, 0.022, min(fDiv.x, fDiv.y));
    vec2 subDiv = abs(fract(div * 5.0) - 0.5);
    float centerAxes = (abs(uv.x - 0.5) < 0.008 || abs(uv.y - 0.5) < 0.01) ? 1.0 : 0.0;
    float minorTicks = (1.0 - smoothstep(0.0, 0.06, min(subDiv.x, subDiv.y))) * centerAxes;

    vec3 gratColor = mix(vec3(0.04, 0.16, 0.11), vec3(0.24, 0.15, 0.05), 0.45);
    bg += gratColor * (majorGrid * 0.55 + minorTicks * 0.75) * min(fx, 1.2);

    float waveY = 0.46 + waveAtX * 0.22 * min(fx, 1.35);
    float beamDist = abs(uv.y - waveY);
    float scopeCore = exp(-beamDist * 250.0);
    float scopeHalo = exp(-beamDist * 34.0) * (0.26 + 0.25 * u_audioMid);
    bg += (vec3(0.58, 1.0, 0.84) * scopeCore * 0.48 + vec3(0.08, 0.68, 0.44) * scopeHalo) * min(fx, 1.35);
  } else {
    // ARCADE NEON — Audio-reactive 3D synthwave horizon grid + FFT equalizer horizon!
    bg = mix(vec3(0.025, 0.008, 0.048), vec3(0.008, 0.020, 0.045), uv.y);
    float horizonY = 0.36 + u_audioBass * 0.035 * min(fx, 1.3);
    if (uv.y < horizonY && fx > 0.05) {
      float py = max(0.015, horizonY - uv.y);
      float z = 0.14 / py;
      float xProj = (uv.x - 0.5) * z * 2.4;
      float gx = 1.0 - smoothstep(0.0, 0.06, abs(fract(xProj) - 0.5));
      float gz = 1.0 - smoothstep(0.0, 0.07, abs(fract(z - u_time * (0.8 + u_blastRate + u_audioBass)) - 0.5));
      float fade = smoothstep(horizonY, 0.02, uv.y);
      bg += vec3(0.48 + u_audioBass * 0.35, 0.06, 0.42) * max(gx, gz) * fade * 0.45 * min(fx, 1.25);
    }
    // Horizon FFT equalizer silhouette
    float eqTop = horizonY + fftAtX * 0.14 * min(fx, 1.3);
    if (uv.y >= horizonY && uv.y < eqTop) {
      bg += vec3(0.32, 0.05, 0.28) * (1.0 - (uv.y - horizonY) / max(0.005, eqTop - horizonY)) * 0.45;
    }
  }

  vec3 col = bg + trail * 0.55 + bloom;

  if (u_preset == 3 && fx > 0.1) {
    vec3 neonGrad = mix(vec3(1.0, 0.38, 0.82), vec3(0.35, 0.96, 1.0), fract(uv.y * 2.2 - u_time * 0.25));
    float luma = dot(crispGlyph, vec3(0.299, 0.587, 0.114));
    crispGlyph = mix(crispGlyph, crispGlyph * 0.55 + neonGrad * luma * 0.85, 0.38 * min(fx, 1.2));
  }

  col = max(col, crispGlyph) + crispGlyph * (0.22 + 0.16 * u_audioBass) * fx;

  if (shockRing > 0.002) {
    vec3 ringCol = u_preset == 3 ? vec3(1.0, 0.32, 0.78) : vec3(0.35, 0.95, 1.0);
    col += ringCol * shockRing * 0.42 * fx;
  }

  if (abs(sliceGlitch) > 0.008) {
    col = mix(col, col.gbr + vec3(0.08, 0.0, 0.06), 0.35);
  }

  if (fx > 0.04) {
    float scanFreq = u_res.y * 0.5;
    float scanWave = 0.5 + 0.5 * sin(uv.y * scanFreq * 3.14159);
    float charBrightness = clamp(dot(crispGlyph, vec3(0.333)), 0.0, 1.0);
    float scanDepth = (u_preset == 0 ? 0.26 : (u_preset == 2 ? 0.16 : 0.14)) * min(fx, 1.3) * (1.0 - charBrightness * 0.58);
    col *= (1.0 - scanDepth * scanWave);

    if (u_preset == 0 || u_preset == 3) {
      float triad = mod(floor(uv.x * u_res.x), 3.0);
      vec3 mask = triad < 1.0 ? vec3(1.06, 0.96, 0.96)
                : (triad < 2.0 ? vec3(0.96, 1.06, 0.96) : vec3(0.96, 0.96, 1.06));
      col *= mix(vec3(1.0), mask, 0.45 * min(fx, 1.0));
    }
  }

  col += vec3(0.20, 0.38, 0.35) * u_flashPulse * 0.32 * min(fx, 1.2);

  vec2 vigUv = uv * (1.0 - uv.yx);
  float vig = pow(max(0.0, vigUv.x * vigUv.y * 16.0), 0.16 * min(fx, 1.2));
  col *= mix(1.0, vig, 0.75 * min(fx, 1.0));

  if ((u_preset == 0 || u_preset == 2) && fx > 0.1) {
    float sheen = exp(-length(uv - vec2(0.14, 0.88)) * 7.5) * 0.035 * min(fx, 1.0);
    col += vec3(0.7, 0.88, 1.0) * sheen;
  }

  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

  function compileShader(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error("[LogBlaster] GLSL compile error:", gl.getShaderInfoLog(sh));
      gl.deleteShader(sh);
      return null;
    }
    return sh;
  }

  function createProgram(vsSrc, fsSrc) {
    const vs = compileShader(gl.VERTEX_SHADER, vsSrc);
    const fs = compileShader(gl.FRAGMENT_SHADER, fsSrc);
    if (!vs || !fs) return null;
    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.error("[LogBlaster] GLSL link error:", gl.getProgramInfoLog(prog));
      return null;
    }
    return prog;
  }

  let feedbackProg = null;
  let compositeProg = null;
  let emptyVao = null;
  let textTex = null;
  let audioTex = null;
  let fboA = null, texA = null;
  let fboB = null, texB = null;
  let fbUniforms = {};
  let compUniforms = {};

  function makeRenderTarget(w, h) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { fbo, tex };
  }

  function resizePipelines() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = Math.max(320, Math.floor(window.innerWidth * dpr));
    const h = Math.max(200, Math.floor(window.innerHeight * dpr));

    if (glCanvas.width === w && glCanvas.height === h) return;

    glCanvas.width = w;
    glCanvas.height = h;
    textCanvas.width = w;
    textCanvas.height = h;
    textCanvas._dpr = dpr;

    if (!gl) return;

    if (!textTex) textTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, textTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    if (!audioTex) {
      audioTex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, audioTex);
      gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, AUDIO_TEX_WIDTH, 2, 0, gl.RED, gl.UNSIGNED_BYTE, state.audioTexBytes);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    }

    if (fboA) { gl.deleteFramebuffer(fboA); gl.deleteTexture(texA); }
    if (fboB) { gl.deleteFramebuffer(fboB); gl.deleteTexture(texB); }

    const rtA = makeRenderTarget(w, h);
    const rtB = makeRenderTarget(w, h);
    fboA = rtA.fbo; texA = rtA.tex;
    fboB = rtB.fbo; texB = rtB.tex;
  }

  if (gl) {
    feedbackProg = createProgram(VERT_SRC, FEEDBACK_FRAG);
    compositeProg = createProgram(VERT_SRC, COMPOSITE_FRAG);
    emptyVao = gl.createVertexArray();

    for (const u of ["u_textTex", "u_prevTex", "u_res", "u_time", "u_preset", "u_fx", "u_blastRate", "u_audioBass"]) {
      fbUniforms[u] = gl.getUniformLocation(feedbackProg, u);
    }
    for (const u of [
      "u_textTex", "u_feedbackTex", "u_audioTex", "u_res", "u_time", "u_preset", "u_fx",
      "u_blastRate", "u_stepPulse", "u_nodePulse", "u_glitchBurst",
      "u_flashPulse", "u_degauss", "u_shockTime", "u_shockCenter",
      "u_audioBass", "u_audioMid", "u_audioHigh",
    ]) {
      compUniforms[u] = gl.getUniformLocation(compositeProg, u);
    }
  }

  window.addEventListener("resize", resizePipelines);
  resizePipelines();

  // =========================================================================
  // 9. MAIN RENDER LOOP
  // =========================================================================
  let lastFrameMs = performance.now();
  let fpsFrames = 0;
  let fpsTimerMs = lastFrameMs;
  let pingPong = false;

  function renderFrame(nowMs) {
    requestAnimationFrame(renderFrame);
    if (document.hidden) {
      lastFrameMs = nowMs;
      return;
    }

    const dtSec = Math.min(0.1, Math.max(0.001, (nowMs - lastFrameMs) / 1000));
    lastFrameMs = nowMs;

    fpsFrames++;
    if (nowMs - fpsTimerMs >= 500) {
      state.fps = Math.round((fpsFrames * 1000) / (nowMs - fpsTimerMs));
      fpsFrames = 0;
      fpsTimerMs = nowMs;
    }

    state.blastRate = Math.max(0.0, state.blastRate - dtSec * 0.72);
    state.stepPulse = Math.max(0.0, state.stepPulse - dtSec * 2.6);
    state.nodePulse = Math.max(0.0, state.nodePulse - dtSec * 1.9);
    state.glitchBurst = Math.max(0.0, state.glitchBurst - dtSec * 1.65);
    state.flashPulse = Math.max(0.0, state.flashPulse - dtSec * 1.8);
    state.degaussWobble = Math.max(0.0, state.degaussWobble - dtSec * 1.4);

    updateAudioAnalysis(nowMs, dtSec);
    renderTextTexture(nowMs, dtSec);
    if (!gl || !feedbackProg || !compositeProg) return;

    const w = glCanvas.width;
    const h = glCanvas.height;
    const tSec = nowMs * 0.001;

    // Upload 2D log text canvas -> TEXTURE0
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, textTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, textCanvas);

    // Upload 512-byte live audio waveform+FFT -> TEXTURE2 (0.002ms!)
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, audioTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, AUDIO_TEX_WIDTH, 2, gl.RED, gl.UNSIGNED_BYTE, state.audioTexBytes);

    const readTex = pingPong ? texA : texB;
    const writeFbo = pingPong ? fboB : fboA;
    const writeTex = pingPong ? texB : texA;
    pingPong = !pingPong;

    gl.bindVertexArray(emptyVao);

    // PASS 1 -> Ping-Pong Temporal Feedback FBO
    gl.bindFramebuffer(gl.FRAMEBUFFER, writeFbo);
    gl.viewport(0, 0, w, h);
    gl.useProgram(feedbackProg);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, textTex);
    gl.uniform1i(fbUniforms.u_textTex, 0);

    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, readTex);
    gl.uniform1i(fbUniforms.u_prevTex, 1);

    gl.uniform2f(fbUniforms.u_res, w, h);
    gl.uniform1f(fbUniforms.u_time, tSec);
    gl.uniform1i(fbUniforms.u_preset, state.preset);
    gl.uniform1f(fbUniforms.u_fx, state.fxIntensity);
    gl.uniform1f(fbUniforms.u_blastRate, state.blastRate);
    gl.uniform1f(fbUniforms.u_audioBass, state.audioBass);

    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // PASS 2 -> Final Audio-Reactive GPU Composite
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, w, h);
    gl.useProgram(compositeProg);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, textTex);
    gl.uniform1i(compUniforms.u_textTex, 0);

    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, writeTex);
    gl.uniform1i(compUniforms.u_feedbackTex, 1);

    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, audioTex);
    gl.uniform1i(compUniforms.u_audioTex, 2);

    gl.uniform2f(compUniforms.u_res, w, h);
    gl.uniform1f(compUniforms.u_time, tSec);
    gl.uniform1i(compUniforms.u_preset, state.preset);
    gl.uniform1f(compUniforms.u_fx, state.fxIntensity);
    gl.uniform1f(compUniforms.u_blastRate, state.blastRate);
    gl.uniform1f(compUniforms.u_stepPulse, state.stepPulse);
    gl.uniform1f(compUniforms.u_nodePulse, state.nodePulse);
    gl.uniform1f(compUniforms.u_glitchBurst, state.glitchBurst);
    gl.uniform1f(compUniforms.u_flashPulse, state.flashPulse);
    gl.uniform1f(compUniforms.u_degauss, state.degaussWobble);
    gl.uniform1f(compUniforms.u_shockTime, state.shockwaveTime);
    gl.uniform2f(compUniforms.u_shockCenter, state.shockwaveCenter[0], state.shockwaveCenter[1]);
    gl.uniform1f(compUniforms.u_audioBass, state.audioBass);
    gl.uniform1f(compUniforms.u_audioMid, state.audioMid);
    gl.uniform1f(compUniforms.u_audioHigh, state.audioHigh);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  ingestLogChunk("[LogBlaster] Audio-Reactive WebGL2 GPU Log Visualizer ready (Keys: 1-4 Shaders | M Synth | A Audio In | B Test Blast)\n");
  ingestLogChunk(`[LogBlaster] Active Shader GPU: ${state.shaderRendererName} (powerPreference=${preferHighGpu ? "high-performance" : "low-power"})\n`);
  connectComfySocket();
  requestAnimationFrame(renderFrame);
})();
