<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ComfyUI // LOG BLASTER — Audio-Reactive GPU Shader Terminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2306101a'/%3E%3Cpath d='M6 18h5l3-9 4 14 3-7h5' stroke='%234df3ff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root {
    --hud-bg: rgba(8, 12, 18, 0.86);
    --hud-border: rgba(92, 225, 230, 0.34);
    --hud-accent: #4df3ff;
    --hud-hot: #ff3e7f;
    --hud-ok: #38ffb3;
    --hud-err: #ff4769;
    --hud-text: #d9f4ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030508;
    color: var(--hud-text);
    font-family: "Cascadia Mono", "JetBrains Mono", "Consolas", "Courier New", monospace;
    user-select: none;
  }
  #glCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }
  #controlDock {
    position: fixed;
    bottom: 12px;
    right: 14px;
    left: 14px;
    max-width: fit-content;
    margin-left: auto;
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 10px;
    background: var(--hud-bg);
    border: 1px solid var(--hud-border);
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.68);
    opacity: 0.44;
    transition: opacity 0.2s ease, border-color 0.2s ease;
    font-size: 11px;
  }
  #controlDock:hover, #controlDock:focus-within {
    opacity: 0.98;
    border-color: rgba(92, 225, 230, 0.74);
  }
  .dock-group {
    display: flex;
    align-items: center;
    gap: 4px;
    padding-right: 6px;
    border-right: 1px solid rgba(255, 255, 255, 0.12);
  }
  .dock-group:last-child {
    border-right: none;
    padding-right: 0;
  }
  button.hud-btn {
    background: rgba(255, 255, 255, 0.06);
    color: #cbe8f6;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 6px;
    padding: 4px 7px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.25px;
    cursor: pointer;
    transition: all 0.14s ease;
  }
  button.hud-btn:hover {
    background: rgba(77, 243, 255, 0.18);
    border-color: var(--hud-accent);
    color: #ffffff;
  }
  button.hud-btn.is-active {
    background: rgba(77, 243, 255, 0.26);
    border-color: var(--hud-accent);
    color: #ffffff;
    box-shadow: 0 0 10px rgba(77, 243, 255, 0.36);
  }
  button.hud-btn.audio-active {
    background: rgba(56, 255, 179, 0.22);
    border-color: var(--hud-ok);
    color: #e6fff5;
    box-shadow: 0 0 10px rgba(56, 255, 179, 0.36);
  }
  button.hud-btn.err-active {
    background: rgba(255, 71, 105, 0.25);
    border-color: var(--hud-err);
    color: #ffe0e7;
    box-shadow: 0 0 10px rgba(255, 71, 105, 0.42);
  }
  button.hud-btn.blast-btn {
    background: rgba(255, 62, 127, 0.2);
    border-color: rgba(255, 62, 127, 0.6);
    color: #ffd6e5;
  }
  button.hud-btn.blast-btn:hover {
    background: rgba(255, 62, 127, 0.38);
    border-color: #ff6a9c;
    color: #ffffff;
    box-shadow: 0 0 12px rgba(255, 62, 127, 0.5);
  }
  input.hud-filter {
    width: 96px;
    background: rgba(0, 0, 0, 0.45);
    color: #e8fbff;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 6px;
    padding: 3px 7px;
    font-family: inherit;
    font-size: 11px;
    outline: none;
  }
  input.hud-filter:focus {
    width: 132px;
    border-color: var(--hud-accent);
    box-shadow: 0 0 8px rgba(77, 243, 255, 0.3);
  }
  .fx-label {
    color: #9dc6d8;
    font-size: 10px;
    letter-spacing: 0.5px;
    margin-right: 2px;
  }
  input[type="range"].fx-slider {
    width: 62px;
    accent-color: var(--hud-accent);
    cursor: pointer;
  }
  #toastMsg {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    background: rgba(10, 18, 26, 0.94);
    border: 1px solid var(--hud-accent);
    color: #e9fbff;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 11px;
    letter-spacing: 0.5px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.22s ease;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.65);
  }
  #toastMsg.visible { opacity: 1; }
</style>
</head>
<body>
<canvas id="glCanvas"></canvas>
<div id="toastMsg"></div>

<div id="controlDock" aria-label="LogBlaster Shader and Audio Controls">
  <div class="dock-group">
    <button class="hud-btn is-active" data-preset="0" title="Hotkey: 1">1 CRT</button>
    <button class="hud-btn" data-preset="1" title="Hotkey: 2">2 CYBER</button>
    <button class="hud-btn" data-preset="2" title="Hotkey: 3">3 SCOPE</button>
    <button class="hud-btn" data-preset="3" title="Hotkey: 4">4 ARCADE</button>
    <button class="hud-btn is-active" id="btnView" title="Cycle Depth & Scale Layout: CASCADE (giant live text -> shrinking trail), DUAL (2-layer colossal hero + background log), DRUM (3D curved cylinder), FLAT (uniform) (Hotkey: V)">VIEW: CASCADE</button>
  </div>
  <div class="dock-group">
    <button class="hud-btn" id="btnSynth" title="Procedural Log-Reactive Telemetry Synth + Audio FFT (Hotkey: M)">SYNTH: OFF</button>
    <button class="hud-btn" id="btnAudioIn" title="Click: Capture System/Tab Audio | Shift+Click: Mic Input | Drop audio file anywhere (Hotkey: A)">AUDIO: OFF</button>
  </div>
  <div class="dock-group">
    <button class="hud-btn" id="btnTint" title="Cycle Color Palette: AUTO, COMFY B&amp;Y (Black &amp; Yellow), AMBER P3, GREEN P31, ICE CYAN (Hotkey: T, or Y for Comfy Black &amp; Yellow)">TINT: AUTO</button>
    <span class="fx-label">FX</span>
    <input type="range" id="fxSlider" class="fx-slider" min="0" max="160" value="100" title="GPU Shader Intensity (0% raw fast-blit -> 160% overdrive)" />
    <button class="hud-btn" id="btnFps" title="Frame-rate governor: ECO (30fps active / 15fps idle), 60fps, or MAX monitor refresh">FPS: ECO</button>
  </div>
  <div class="dock-group">
    <input type="text" id="filterInput" class="hud-filter" placeholder="Filter (/)" aria-label="Filter log lines" />
    <button class="hud-btn" id="btnErrJump" title="Jump to next error in scrollback (Hotkey: E)">ERR: 0</button>
    <button class="hud-btn is-active" id="btnRedact" title="Toggle token & home-path redaction for safe streaming/copying">REDACT: ON</button>
  </div>
  <div class="dock-group">
    <button class="hud-btn" id="btnFontDown" title="Smaller Log Text (Hotkey: -)">A-</button>
    <button class="hud-btn" id="btnFontUp" title="Larger Log Text (Hotkey: +)">A+</button>
    <button class="hud-btn" id="btnPause" title="Pause / Resume Auto-Scroll (Hotkey: Space)">LIVE</button>
    <button class="hud-btn blast-btn" id="btnTestBlast" title="Fire synthetic ComfyUI log storm to test shaders & audio (Hotkey: B)">TEST BLAST</button>
    <button class="hud-btn" id="btnCopy" title="Copy logs to clipboard (respects REDACT toggle)">COPY</button>
    <button class="hud-btn" id="btnFullscreen" title="Toggle Fullscreen (Hotkey: F)">FULL</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // =========================================================================
  // 1. STATE, URL OVERRIDES, RING BUFFER & TELEMETRY
  // =========================================================================
  const MAX_LINES = 3500;
  const MAX_LINE_CHARS = 2048;
  const MAX_RENDER_WIDTH = 2240;
  const MAX_RENDER_PIXELS = 2_600_000;
  const SPECTRUM_BINS = 48;
  const WAVE_SAMPLES = 160;
  const AUDIO_TEX_WIDTH = 256;

  const PRESET_NAMES = [
    "RETRO CRT PHOSPHOR",
    "CYBERPUNK GLITCH // MATRIX",
    "VINTAGE RADIO OSCILLOSCOPE",
    "ARCADE NEON // SYNTHWAVE",
  ];
  const TINT_NAMES = ["AUTO", "COMFY B&Y", "AMBER P3", "GREEN P31", "ICE CYAN"];
  const FPS_MODES = ["ECO", "60", "MAX"];
  const VIEW_MODES = ["CASCADE", "DUAL", "DRUM", "FLAT"];

  function storageGet(key, fallback = null) {
    try {
      const val = localStorage.getItem(key);
      return val !== null ? val : fallback;
    } catch (_) {
      return fallback;
    }
  }

  function storageSet(key, val) {
    try {
      localStorage.setItem(key, String(val));
    } catch (_) {}
  }

  const params = new URLSearchParams(location.search);
  const preferHighGpu = params.get("gpu") === "high";

  function resolveInitialPreset() {
    const p = params.get("preset");
    if (p !== null && !Number.isNaN(Number(p))) {
      const n = Number(p);
      // Accept 1..4 (human 1-indexed) or 0..3
      return Math.max(0, Math.min(3, n >= 1 && n <= 4 ? n - 1 : n));
    }
    return ((Number(storageGet("logblaster.preset", "0")) % 4) + 4) % 4;
  }

  function resolveInitialTintMode() {
    const raw = (params.get("tint") || "").trim();
    if (raw) {
      const upper = raw.toUpperCase();
      if (upper === "COMFY" || upper === "YELLOW" || upper === "BY" || upper === "COMFY B&Y") return 1;
      if (upper === "AMBER" || upper === "AMBER P3") return 2;
      if (upper === "GREEN" || upper === "GREEN P31") return 3;
      if (upper === "CYAN" || upper === "ICE CYAN") return 4;
      if (upper === "AUTO") return 0;
      const n = Number(raw);
      if (!Number.isNaN(n)) return Math.max(0, Math.min(TINT_NAMES.length - 1, Math.trunc(n)));
    }
    const savedName = (storageGet("logblaster.tintName", "") || "").toUpperCase();
    const byNameIdx = TINT_NAMES.indexOf(savedName);
    if (byNameIdx >= 0) return byNameIdx;
    const savedIdx = Number(storageGet("logblaster.tint", "0"));
    return Number.isFinite(savedIdx)
      ? Math.max(0, Math.min(TINT_NAMES.length - 1, Math.trunc(savedIdx)))
      : 0;
  }

  function resolveInitialFpsMode() {
    const q = (params.get("fps") || "").toUpperCase();
    if (FPS_MODES.includes(q)) return q;
    const saved = (storageGet("logblaster.fpsMode", "ECO") || "ECO").toUpperCase();
    return FPS_MODES.includes(saved) ? saved : "ECO";
  }

  function resolveInitialViewMode() {
    const q = (params.get("view") || "").toUpperCase();
    if (VIEW_MODES.includes(q)) return q;
    const saved = (storageGet("logblaster.viewMode", "CASCADE") || "CASCADE").toUpperCase();
    return VIEW_MODES.includes(saved) ? saved : "CASCADE";
  }

  const state = {
    preset: resolveInitialPreset(),
    viewMode: resolveInitialViewMode(),
    tintMode: resolveInitialTintMode(),
    fxIntensity: params.get("fx") !== null
      ? Math.max(0, Math.min(1.6, Number(params.get("fx")) / 100.0))
      : Number(storageGet("logblaster.fx", "100")) / 100.0,
    fpsMode: resolveInitialFpsMode(),
    redactEnabled: params.get("redact") !== null
      ? params.get("redact") !== "0"
      : storageGet("logblaster.redact", "1") !== "0",
    fontSize: Math.min(22, Math.max(11, Number(storageGet("logblaster.fontSize", "14")) || 14)),
    paused: false,
    scrollBackLines: 0,
    filterQuery: "",

    // Dirty-gating, cached filter versioning & error navigation
    textDirty: true,
    linesVersion: 0,
    lastClockDrawMs: 0,
    newestLineMs: 0,
    errorCount: 0,
    errCursorIdx: -1,

    // Live ComfyUI connection + execution state
    wsConnected: false,
    logSubscribed: false,
    logStreamAvailable: true,
    warnedNoLogSub: false,
    clientId: "logblaster-" + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)),
    runState: "IDLE",
    runStartMs: 0,
    lastElapsedSec: 0,
    activeNodeId: null,
    activeNodeTitle: "Waiting for workflow...",
    nodeTitleMap: new Map(),
    stepVal: 0,
    stepMax: 0,
    stepRateSmooth: 0,
    lastStepMs: 0,

    // Log stream ring buffer
    lines: [],
    lineCounter: 0,
    partialCrActive: false,

    // Kinetic & GPU reactive uniforms
    charsThisSec: 0,
    linesThisSec: 0,
    cpsDisplay: 0,
    lpsDisplay: 0,
    blastRate: 0.0,
    stepPulse: 0.0,
    nodePulse: 0.0,
    glitchBurst: 0.0,
    flashPulse: 0.0,
    degaussWobble: 0.0,
    shockwaveTime: -10.0,
    shockwaveCenter: [0.5, 0.5],
    smoothScrollPx: 0.0,

    // Audio-reactive state
    synthEnabled: false,
    audioInMode: "OFF", // OFF | SYS | MIC | FILE
    audioActive: false,
    currentFileObjectUrl: null,
    audioBass: 0.0,
    audioMid: 0.0,
    audioHigh: 0.0,
    bassAvg: 0.12,
    lastBeatMs: 0,
    audioTexBytes: new Uint8Array(AUDIO_TEX_WIDTH * 2),

    // Real-time character/audio spectrum & waveform
    spectrum: new Float32Array(SPECTRUM_BINS),
    spectrumPeak: new Float32Array(SPECTRUM_BINS),
    waveform: new Float32Array(WAVE_SAMPLES),
    waveWriteIdx: 0,

    // Hardware telemetry & WebGL2 health
    gpuTelemetry: {
      available: false,
      metrics_mode: "nvml", // nvml | vram_only | unavailable
      gpu_name: "Detecting GPU...",
      gpu_util: 0,
      vram_used_mib: 0,
      vram_total_mib: 0,
      temp_c: 0,
      power_w: 0,
    },
    shaderRendererName: "WebGL2 (Adapter Masked)",
    fboReady: false,
    contextLost: false,
    fps: 30,
  };

  state.audioTexBytes.fill(128, 0, AUDIO_TEX_WIDTH);

  // =========================================================================
  // 2. PRIVACY / SECRET REDACTION HELPER
  // =========================================================================
  function redactSensitiveText(input) {
    if (!state.redactEnabled || !input) return input;
    return input
      .replace(/\b(sk-[A-Za-z0-9_-]{3})[A-Za-z0-9_-]{9,}\b/g, "$1***REDACTED***")
      .replace(/\b(gh[pousr]_[A-Za-z0-9]{3})[A-Za-z0-9]{12,}\b/g, "$1***REDACTED***")
      .replace(/\b(hf_[A-Za-z0-9]{3})[A-Za-z0-9]{12,}\b/g, "$1***REDACTED***")
      .replace(/\b(AIza[0-9A-Za-z_-]{3})[0-9A-Za-z_-]{16,}\b/g, "$1***REDACTED***")
      .replace(/\b(AKIA)[0-9A-Z]{16}\b/g, "$1***REDACTED***")
      .replace(/((?:Authorization\s*:\s*)?Bearer\s+)([^\s"',;&]{8,})/gi, "$1***REDACTED***")
      .replace(/(\b(?:api[_-]?key|apikey|access[_-]?token|auth[_-]?token|token|secret|password)\s*[:=]\s*)(["']?)[^\s"',;&]{6,}\2/gi, "$1$2***REDACTED***$2")
      .replace(/[A-Za-z]:\\Users\\[^\\\s"']+\\/gi, "~\\")
      .replace(/[A-Za-z]:\/Users\/[^/\s"']+\//gi, "~/")
      .replace(/\/(?:Users|home)\/[^/\s"']+\//g, "~/");
  }

  // =========================================================================
  // 3. ZERO-ECHO WEB AUDIO FFT + PROCEDURAL LOG-REACTIVE SYNTH ENGINE
  // =========================================================================
  let audioCtx = null;
  let analyser = null;
  let synthMasterGain = null;
  let droneOsc = null;
  let droneGain = null;
  let externalStream = null;
  let externalSourceNode = null;
  let fileAudioEl = null;
  let fileMediaNode = null;
  let fftBuf = null;
  let timeBuf = null;
  let lastTickSoundMs = 0;

  function ensureAudioGraph() {
    if (audioCtx) {
      if (audioCtx.state === "suspended") audioCtx.resume();
      return;
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;

    audioCtx = new Ctx();
    // CRITICAL TOPOLOGY: `analyser` is a pure silent tap sink (NOT connected to
    // `audioCtx.destination`) so external System/Mic capture never echoes!
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.74;
    fftBuf = new Uint8Array(analyser.frequencyBinCount);
    timeBuf = new Uint8Array(analyser.frequencyBinCount);

    synthMasterGain = audioCtx.createGain();
    synthMasterGain.gain.value = 0.24;
    // Audible internal synth connects to BOTH analyser and destination
    synthMasterGain.connect(analyser);
    synthMasterGain.connect(audioCtx.destination);

    droneOsc = audioCtx.createOscillator();
    droneOsc.type = "triangle";
    droneOsc.frequency.value = 58.0;
    const droneFilter = audioCtx.createBiquadFilter();
    droneFilter.type = "lowpass";
    droneFilter.frequency.value = 150.0;
    droneGain = audioCtx.createGain();
    droneGain.gain.value = 0.0;
    droneOsc.connect(droneFilter);
    droneFilter.connect(droneGain);
    droneGain.connect(synthMasterGain);
    droneOsc.start();
  }

  function playSynthTick(kind, energy) {
    if (!state.synthEnabled || !audioCtx || !synthMasterGain) return;
    const nowMs = performance.now();
    if (kind === "normal" && nowMs - lastTickSoundMs < 34) return;
    lastTickSoundMs = nowMs;

    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    if (kind === "error") {
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(210, t);
      osc.frequency.linearRampToValueAtTime(115, t + 0.22);
      gain.gain.setValueAtTime(0.32, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
      osc.connect(gain);
      gain.connect(synthMasterGain);
      osc.start(t);
      osc.stop(t + 0.25);
    } else if (kind === "complete") {
      const notes = [261.63, 392.0, 587.33, 659.25];
      notes.forEach((freq, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = "sine";
        const st = t + idx * 0.055;
        o.frequency.setValueAtTime(freq, st);
        g.gain.setValueAtTime(0.18, st);
        g.gain.exponentialRampToValueAtTime(0.001, st + 0.36);
        o.connect(g);
        g.connect(synthMasterGain);
        o.start(st);
        o.stop(st + 0.38);
      });
    } else if (kind === "shock") {
      osc.type = "sine";
      osc.frequency.setValueAtTime(125, t);
      osc.frequency.exponentialRampToValueAtTime(36, t + 0.24);
      gain.gain.setValueAtTime(0.38, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
      osc.connect(gain);
      gain.connect(synthMasterGain);
      osc.start(t);
      osc.stop(t + 0.27);
    } else if (kind === "progress") {
      const pct = state.stepMax > 0 ? state.stepVal / state.stepMax : 0.5;
      osc.type = "triangle";
      osc.frequency.setValueAtTime(160 + pct * 260, t);
      osc.frequency.exponentialRampToValueAtTime(95 + pct * 140, t + 0.065);
      gain.gain.setValueAtTime(0.16, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
      osc.connect(gain);
      gain.connect(synthMasterGain);
      osc.start(t);
      osc.stop(t + 0.075);
    } else {
      osc.type = "sine";
      const pitch = 520 + ((state.lineCounter * 73) % 440) + energy * 180;
      osc.frequency.setValueAtTime(pitch, t);
      osc.frequency.exponentialRampToValueAtTime(pitch * 0.55, t + 0.024);
      gain.gain.setValueAtTime(0.065, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.028);
      osc.connect(gain);
      gain.connect(synthMasterGain);
      osc.start(t);
      osc.stop(t + 0.03);
    }
  }

  function disconnectExternalAudio() {
    if (externalSourceNode) {
      try { externalSourceNode.disconnect(); } catch (_) {}
      externalSourceNode = null;
    }
    if (externalStream) {
      externalStream.getTracks().forEach((tr) => tr.stop());
      externalStream = null;
    }
    if (fileAudioEl) {
      fileAudioEl.pause();
      fileAudioEl.removeAttribute("src");
    }
    if (state.currentFileObjectUrl) {
      try { URL.revokeObjectURL(state.currentFileObjectUrl); } catch (_) {}
      state.currentFileObjectUrl = null;
    }
    state.audioInMode = "OFF";
    state.audioActive = state.synthEnabled;
    state.textDirty = true;
  }

  async function toggleExternalAudio(useMic = false) {
    if (state.audioInMode !== "OFF") {
      disconnectExternalAudio();
      syncControlsUI();
      showToast("EXTERNAL AUDIO INPUT DISCONNECTED");
      return;
    }

    ensureAudioGraph();
    if (!audioCtx || !analyser) {
      showToast("WEB AUDIO UNAVAILABLE");
      return;
    }

    try {
      let stream = null;
      if (useMic) {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
          video: false,
        });
        state.audioInMode = "MIC";
      } else {
        stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
        });
        stream.getVideoTracks().forEach((vt) => vt.stop());
        if (stream.getAudioTracks().length === 0) {
          stream.getTracks().forEach((tr) => tr.stop());
          showToast("TIP: Tick 'Also share system audio' in picker (or Shift+Click for Mic)");
          return;
        }
        state.audioInMode = "SYS";
      }

      externalStream = stream;
      externalSourceNode = audioCtx.createMediaStreamSource(stream);
      // Terminal analyser ONLY -> zero echo / zero feedback!
      externalSourceNode.connect(analyser);
      stream.getAudioTracks()[0].addEventListener("ended", () => {
        disconnectExternalAudio();
        syncControlsUI();
      });

      state.audioActive = true;
      state.textDirty = true;
      syncControlsUI();
      showToast(`AUDIO REACTIVE LIVE (${state.audioInMode} FFT)`);
    } catch (_) {
      showToast("AUDIO CAPTURE CANCELLED (Shift+Click AUDIO for Mic, or use SYNTH)");
    }
  }

  window.addEventListener("dragover", (ev) => ev.preventDefault());
  window.addEventListener("drop", (ev) => {
    ev.preventDefault();
    const file = ev.dataTransfer?.files?.[0];
    if (!file) return;
    const isAudio =
      (file.type && file.type.startsWith("audio/")) ||
      /\.(mp3|wav|ogg|flac|m4a|aac|opus|webm)$/i.test(file.name || "");
    if (!isAudio) {
      showToast("DROP AN AUDIO FILE (.mp3, .wav, .ogg, .flac, .m4a)");
      return;
    }
    ensureAudioGraph();
    disconnectExternalAudio();
    if (!fileAudioEl) {
      fileAudioEl = new Audio();
      fileAudioEl.crossOrigin = "anonymous";
      fileAudioEl.addEventListener("ended", () => {
        disconnectExternalAudio();
        syncControlsUI();
      });
      fileAudioEl.addEventListener("error", () => {
        if (state.audioInMode === "FILE") {
          disconnectExternalAudio();
          syncControlsUI();
          showToast("AUDIO FILE PLAYBACK ENDED / UNSUPPORTED");
        }
      });
    }
    state.currentFileObjectUrl = URL.createObjectURL(file);
    fileAudioEl.src = state.currentFileObjectUrl;
    fileAudioEl.loop = false;
    if (!fileMediaNode && audioCtx && analyser) {
      fileMediaNode = audioCtx.createMediaElementSource(fileAudioEl);
      // Dropped media file should be both heard and analyzed!
      fileMediaNode.connect(analyser);
      fileMediaNode.connect(audioCtx.destination);
    }
    state.audioInMode = "FILE";
    state.audioActive = true;
    state.textDirty = true;
    syncControlsUI();
    fileAudioEl.play().then(() => {
      ingestLogChunk(`[LogBlaster:SHOCKWAVE] >>> AUDIO-REACTIVE PLAYBACK: ${file.name} <<<\n`);
      showToast(`PLAYING & VISUALIZING: ${file.name}`);
    }).catch(() => {
      disconnectExternalAudio();
      syncControlsUI();
      showToast("COULD NOT DECODE AUDIO FILE");
    });
  });

  function updateAudioAnalysis(nowMs, dtSec) {
    state.audioActive = state.synthEnabled || state.audioInMode !== "OFF";

    if (state.synthEnabled && droneGain && audioCtx) {
      const targetDrone = Math.min(0.18, state.blastRate * 0.11 + (state.runState === "BLASTING" ? 0.045 : 0.0));
      droneGain.gain.setTargetAtTime(targetDrone, audioCtx.currentTime, 0.08);
      if (droneOsc) {
        droneOsc.frequency.setTargetAtTime(55 + state.blastRate * 28, audioCtx.currentTime, 0.1);
      }
    } else if (droneGain && audioCtx) {
      droneGain.gain.setTargetAtTime(0.0, audioCtx.currentTime, 0.05);
    }

    if (!state.audioActive || !analyser || !fftBuf || !timeBuf) {
      state.audioBass = Math.max(0.0, state.audioBass - dtSec * 2.5);
      state.audioMid = Math.max(0.0, state.audioMid - dtSec * 2.5);
      state.audioHigh = Math.max(0.0, state.audioHigh - dtSec * 2.5);
      for (let i = 0; i < AUDIO_TEX_WIDTH; i++) {
        const wIdx = (state.waveWriteIdx + Math.floor((i / AUDIO_TEX_WIDTH) * WAVE_SAMPLES)) % WAVE_SAMPLES;
        const synthWave = state.waveform[wIdx] * 0.55 + Math.sin(i * 0.11 - nowMs * 0.007) * (0.06 + state.blastRate * 0.18);
        state.audioTexBytes[i] = Math.max(0, Math.min(255, Math.round(128 + synthWave * 115)));
        const sBin = Math.min(SPECTRUM_BINS - 1, Math.floor((i / AUDIO_TEX_WIDTH) * SPECTRUM_BINS));
        state.audioTexBytes[AUDIO_TEX_WIDTH + i] = Math.max(0, Math.min(255, Math.round(state.spectrum[sBin] * 210)));
      }
      return;
    }

    analyser.getByteFrequencyData(fftBuf);
    analyser.getByteTimeDomainData(timeBuf);

    for (let i = 0; i < AUDIO_TEX_WIDTH; i++) {
      state.audioTexBytes[i] = timeBuf[i];
      state.audioTexBytes[AUDIO_TEX_WIDTH + i] = fftBuf[i];
    }

    let bSum = 0, mSum = 0, hSum = 0;
    for (let i = 1; i <= 8; i++) bSum += fftBuf[i];
    for (let i = 9; i <= 48; i++) mSum += fftBuf[i];
    for (let i = 49; i <= 140; i++) hSum += fftBuf[i];

    const instBass = (bSum / (8 * 255)) * 1.45;
    const instMid = (mSum / (40 * 255)) * 1.55;
    const instHigh = (hSum / (92 * 255)) * 1.75;

    state.audioBass = state.audioBass * 0.55 + instBass * 0.45;
    state.audioMid = state.audioMid * 0.55 + instMid * 0.45;
    state.audioHigh = state.audioHigh * 0.50 + instHigh * 0.50;

    state.bassAvg = state.bassAvg * 0.94 + instBass * 0.06;
    if (instBass > 0.36 && instBass > state.bassAvg * 1.42 && (nowMs - state.lastBeatMs) > 240) {
      state.lastBeatMs = nowMs;
      triggerShockwave(0.3 + Math.random() * 0.4, 0.35 + Math.random() * 0.3);
    }

    for (let b = 0; b < SPECTRUM_BINS; b++) {
      const fftIdx = Math.min(200, Math.floor(Math.pow(b / SPECTRUM_BINS, 1.45) * 180) + 1);
      const fftNorm = (fftBuf[fftIdx] / 255) * 1.22;
      state.spectrum[b] = Math.max(state.spectrum[b], fftNorm);
    }
    for (let s = 0; s < WAVE_SAMPLES; s++) {
      const tIdx = Math.floor((s / WAVE_SAMPLES) * AUDIO_TEX_WIDTH);
      state.waveform[s] = (timeBuf[tIdx] - 128) / 128.0;
    }
    state.waveWriteIdx = 0;
    state.textDirty = true;
  }

  // =========================================================================
  // 4. TOAST, FILTER, ERROR-JUMP & UI CONTROLS
  // =========================================================================
  const toastEl = document.getElementById("toastMsg");
  let toastTimer = null;
  function showToast(msg) {

  const presetBtns = Array.from(document.querySelectorAll("[data-preset]"));

  let cachedFilterVersion = -1;
  let cachedFilterQuery = "";
  let cachedFilteredLines = state.lines;

  function getFilteredLines() {
    const q = state.filterQuery.trim().toLowerCase();
    if (!q) return state.lines;
    if (cachedFilterVersion === state.linesVersion && cachedFilterQuery === q) {
      return cachedFilteredLines;
    }
    cachedFilteredLines = state.lines.filter((l) => l.viewLower.includes(q));
    cachedFilterVersion = state.linesVersion;
    cachedFilterQuery = q;
    return cachedFilteredLines;
  }

  function recomputeErrorCount() {
    let errs = 0;
    for (let i = 0; i < state.lines.length; i++) {

  }

  function syncControlsUI() {

  }

  function setPreset(idx) {

  presetBtns.forEach((b) => {
    b.addEventListener("click", () => setPreset(Number(b.dataset.preset)));
  });

  function cycleViewMode() {
    const nextIdx = (VIEW_MODES.indexOf(state.viewMode) + 1) % VIEW_MODES.length;
    state.viewMode = VIEW_MODES[nextIdx];
    storageSet("logblaster.viewMode", state.viewMode);
    for (const line of state.lines) {
      line._smoothH = 0;
    }
    state.nodePulse = Math.max(state.nodePulse, 0.45);
    syncControlsUI();
    const descMap = {
      CASCADE: "GIANT LIVE HERO -> SHRINKING TRAIL",
      DUAL: "DUAL-LAYER COLOSSAL HERO + DENSE LOG",
      DRUM: "3D CURVED PERSPECTIVE DRUM + CASCADE",
      FLAT: "UNIFORM MONOSPACE TERMINAL",
    };
    showToast(`VIEW: ${state.viewMode} (${descMap[state.viewMode] || state.viewMode})`);
  }

  if (btnView) {
    btnView.addEventListener("click", cycleViewMode);
  }

  btnSynth.addEventListener("click", () => {

  function setTintMode(idx) {

    storageSet("logblaster.tint", state.tintMode);

  fxSlider.addEventListener("input", () => {

    storageSet("logblaster.fx", fxSlider.value);
    state.textDirty = true;
  });

  btnFps.addEventListener("click", () => {
    const nextIdx = (FPS_MODES.indexOf(state.fpsMode) + 1) % FPS_MODES.length;
    state.fpsMode = FPS_MODES[nextIdx];

  filterInput.addEventListener("input", () => {

  });

  filterInput.addEventListener("keydown", (ev) => {

  function jumpToNextError() {
    const activeList = getFilteredLines();
    const errIndices = [];
    for (let i = 0; i < activeList.length; i++) {
      if (activeList[i].kind === "error") errIndices.push(i);
    }
    if (!errIndices.length) {
      showToast("NO ERRORS IN LOG BUFFER");
      return;
    }
    // Cycle backward from newest error through older errors; spotlight directly in Hero slot when non-FLAT
    state.errCursorIdx = (state.errCursorIdx + 1) % errIndices.length;
    const targetIdx = errIndices[errIndices.length - 1 - state.errCursorIdx];
    const marginFromBottom = state.viewMode === "FLAT" ? 4 : 0;
    const fromEnd = Math.max(0, activeList.length - 1 - targetIdx - marginFromBottom);
    state.paused = true;
    state.scrollBackLines = Math.min(Math.max(0, activeList.length - 1), fromEnd);
    state.flashPulse = 0.55;
    syncControlsUI();
    showToast(`ERROR ${state.errCursorIdx + 1}/${errIndices.length}: ${activeList[targetIdx].viewRaw.slice(0, 52)}`);
  }

  btnErrJump.addEventListener("click", jumpToNextError);

  btnRedact.addEventListener("click", () => {
    state.redactEnabled = !state.redactEnabled;
    storageSet("logblaster.redact", state.redactEnabled ? "1" : "0");
    // Rebuild display spans from stored raw source so redaction toggles cleanly in ~3ms
    for (const line of state.lines) {

    }
    state.linesVersion++;
    syncControlsUI();
    showToast(state.redactEnabled ? "PRIVACY REDACTION: ON (Tokens & Home Paths Masked)" : "PRIVACY REDACTION: OFF (Raw Local Paths)");
  });

  document.getElementById("btnFontDown").addEventListener("click", () => {
    state.fontSize = Math.max(11, state.fontSize - 1);

    state.textDirty = true;
    showToast(`FONT SIZE: ${state.fontSize}px`);
  });

  btnPause.addEventListener("click", () => {
    state.paused = !state.paused;
    if (!state.paused) state.scrollBackLines = 0;
    syncControlsUI();
  });

  document.getElementById("btnCopy").addEventListener("click", async () => {
    const activeList = getFilteredLines();
    const outText = activeList.map((l) => `${l.timeStr} ${l.viewRaw}`).join("\n");
    try {
      await navigator.clipboard.writeText(outText);
      showToast(`COPIED ${activeList.length} LOG LINES (${state.redactEnabled ? "REDACTED" : "RAW"})`);
    } catch (_) {

  });

  document.getElementById("btnFullscreen").addEventListener("click", () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.();
    } else {
      document.exitFullscreen?.();
    }
  });

  window.addEventListener("wheel", (ev) => {
    const activeList = getFilteredLines();
    const deltaLines = Math.sign(ev.deltaY) * 4;
    if (deltaLines < 0) {
      state.paused = true;
      state.scrollBackLines = Math.min(
        Math.max(0, activeList.length - 5),
        state.scrollBackLines - deltaLines
      );
    } else if (state.scrollBackLines > 0) {
      state.scrollBackLines = Math.max(0, state.scrollBackLines - deltaLines);
      if (state.scrollBackLines === 0) state.paused = false;
    }
    syncControlsUI();
  }, { passive: true });

  window.addEventListener("keydown", (ev) => {
    if (ev.target && ev.target.tagName === "INPUT") return;
    if (ev.key === "/") {
      ev.preventDefault();
      filterInput.focus();
      filterInput.select();
    } else if (ev.key === "1") setPreset(0);
    else if (ev.key === "2") setPreset(1);
    else if (ev.key === "3") setPreset(2);
    else if (ev.key === "4") setPreset(3);
    else if (ev.key === "v" || ev.key === "V") cycleViewMode();
    else if (ev.key === "e" || ev.key === "E") jumpToNextError();
    else if (ev.key === "m" || ev.key === "M") btnSynth.click();
    else if (ev.key === "a" || ev.key === "A") toggleExternalAudio(Boolean(ev.shiftKey));
    else if (ev.key === "t" || ev.key === "T") setTintMode(state.tintMode + 1);
    else if (ev.key === "y" || ev.key === "Y") setTintMode(state.tintMode === 1 ? 0 : 1);
    else if (ev.key === " ") { ev.preventDefault(); btnPause.click(); }
    else if (ev.key === "-" || ev.key === "_") document.getElementById("btnFontDown").click();
    else if (ev.key === "=" || ev.key === "+") document.getElementById("btnFontUp").click();
    else if (ev.key === "f" || ev.key === "F") document.getElementById("btnFullscreen").click();
    else if (ev.key === "b" || ev.key === "B") startTestBlast();
  });

  // =========================================================================
  // 5. ANSI + SEMANTIC LOG PARSER & SIGNAL ANALYZER
  // =========================================================================
  const ANSI_16 = {
    30: "#586e75", 31: "#ff4d6d", 32: "#38ffb3", 33: "#ffc845",
    34: "#52b7ff", 35: "#ff66d9", 36: "#4df3ff", 37: "#e6f4ff",
    90: "#7a93a6", 91: "#ff6b86", 92: "#69ffca", 93: "#ffe066",
    94: "#80cbff", 95: "#ff8ce6", 96: "#88f8ff", 97: "#ffffff",
  };

  function triggerShockwave(cx = 0.5, cy = 0.48) {
    state.shockwaveTime = performance.now() * 0.001;
    state.shockwaveCenter = [cx, cy];
    state.textDirty = true;
  }

  function feedSignalAnalyzer(text, energyBoost, kind) {
    const len = text.length;
    if (!len) return;
    state.charsThisSec += len;
    state.blastRate = Math.min(1.6, state.blastRate + Math.min(0.45, len * 0.0022) + energyBoost * 0.18);
    playSynthTick(kind, energyBoost);

    let waveAcc = 0;
    const stride = Math.max(1, Math.floor(len / 48));
    for (let i = 0; i < len; i += stride) {
      const code = text.charCodeAt(i);
      let bin = 0;
      if (code >= 48 && code <= 57) {
        bin = 24 + (code - 48);
      } else if (code >= 65 && code <= 90) {
        bin = 2 + ((code - 65) % 13);
      } else if (code >= 97 && code <= 122) {
        bin = 15 + ((code - 97) % 9);
      } else if (code > 127) {
        bin = 40 + (code % 8);
      } else {
        bin = 34 + (code % 6);
      }
      state.spectrum[bin] = Math.min(1.35, state.spectrum[bin] + 0.16 + energyBoost * 0.14);
      waveAcc += ((code & 31) - 15.5) / 15.5;
    }
    state.spectrum[0] = Math.min(1.35, state.spectrum[0] + 0.25 + energyBoost * 0.3);
    state.spectrum[1] = Math.min(1.35, state.spectrum[1] + 0.20 + energyBoost * 0.25);

    if (!state.audioActive) {
      const sampleCount = Math.ceil(len / stride);
      const normWave = Math.max(-1, Math.min(1, (waveAcc / Math.max(1, sampleCount)) * (0.65 + state.blastRate * 0.6)));
      state.waveform[state.waveWriteIdx] = normWave;
      state.waveWriteIdx = (state.waveWriteIdx + 1) % WAVE_SAMPLES;
    }
  }

  function classifySemanticLine(plain, triggerFx = true) {
    if (/\[LogBlaster:SHOCKWAVE\]/i.test(plain)) {
      if (triggerFx) {
        triggerShockwave(0.5, 0.5);
        state.flashPulse = Math.max(state.flashPulse, 0.7);
      }
      return { color: "#4df3ff", kind: "shock", energy: 0.9 };
    }
    if (/\[LogBlaster:GLITCH_BURST\]/i.test(plain)) {
      if (triggerFx) state.glitchBurst = 1.0;
      return { color: "#ff3e7f", kind: "error", energy: 1.0 };
    }
    if (/\[LogBlaster:PHOSPHOR_FLASH\]/i.test(plain)) {
      if (triggerFx) state.flashPulse = 1.0;
      return { color: "#fff3a1", kind: "complete", energy: 0.95 };
    }
    if (/(\[ERROR\]|Traceback|Exception:|RenderError|CUDA out of memory|\bFAILED\b)/i.test(plain)) {
      if (triggerFx) state.glitchBurst = Math.max(state.glitchBurst, 0.85);
      return { color: "#ff4769", kind: "error", energy: 1.0 };
    }
    if (/(\[WARNING\]|\bWARN\b|UserWarning|FutureWarning)/i.test(plain)) {
      return { color: "#ffc94a", kind: "warn", energy: 0.45 };
    }
    if (/(Prompt executed in|obs_publish OK|execution_success|=== COMPLETE ===)/i.test(plain)) {
      if (triggerFx) {
        triggerShockwave(0.5, 0.42);
        state.flashPulse = Math.max(state.flashPulse, 0.85);
      }
      return { color: "#4dffb5", kind: "complete", energy: 0.95 };
    }
    if (/(\d+%\|[█▉▊▋▌▍▎▏#=\- ]+\||\bit\/s\b|\bs\/it\b|\btok\/s\b)/.test(plain)) {
      if (triggerFx) state.stepPulse = Math.max(state.stepPulse, 0.55);
      return { color: "#7ef9ff", kind: "progress", energy: 0.65 };
    }
    if (/(\[OldTimeRadio\]|\[OTR\]|\[LogBlaster\]|\[launch\])/i.test(plain)) {
      return { color: "#5ce6ff", kind: "badge", energy: 0.4 };
    }
    return { color: "#cde8f6", kind: "normal", energy: 0.12 };
  }

  function tokenizeSpans(rawSegment, baseColor) {
    const spans = [];
    const ansiRegex = /\x1b\[([0-9;]*)m/g;
    let lastIdx = 0;
    let curColor = null;
    let bold = false;
    let match;

    const pushHighlightedChunk = (chunk, explicitColor) => {
      if (!chunk) return;
      if (explicitColor) {
        spans.push({ text: chunk, color: explicitColor, hot: bold });
        return;
      }
      const tokRe = /(\[[^\]]{2,28}\]|\d+%\|[^|]+\||(?:\b\d+(?:\.\d+)?(?:it\/s|s\/it|tok\/s|MiB|GiB|MB|GB|ms|s|%)\b))/g;
      let tLast = 0;
      let tm;
      while ((tm = tokRe.exec(chunk)) !== null) {
        if (tm.index > tLast) {
          spans.push({ text: chunk.slice(tLast, tm.index), color: baseColor, hot: false });
        }
        const tok = tm[0];
        let tokColor = "#ffffff";
        if (tok.startsWith("[")) {
          if (/error|fail/i.test(tok)) tokColor = "#ff5c7c";
          else if (/warn/i.test(tok)) tokColor = "#ffd15c";
          else tokColor = "#59f3ff";
        } else if (tok.includes("%|")) {
          tokColor = "#7affd4";
        } else {
          tokColor = "#ffe680";
        }
        spans.push({ text: tok, color: tokColor, hot: true });
        tLast = tm.index + tok.length;
      }
      if (tLast < chunk.length) {
        spans.push({ text: chunk.slice(tLast), color: baseColor, hot: false });
      }
    };

    while ((match = ansiRegex.exec(rawSegment)) !== null) {
      if (match.index > lastIdx) {
        pushHighlightedChunk(rawSegment.slice(lastIdx, match.index), curColor);
      }
      const codes = (match[1] || "0").split(";").map(Number);
      for (let i = 0; i < codes.length; i++) {
        const c = codes[i];
        if (c === 0) { curColor = null; bold = false; }
        else if (c === 1) { bold = true; }
        else if (ANSI_16[c]) { curColor = ANSI_16[c]; }
        else if (c === 38 && codes[i + 1] === 5 && codes[i + 2] !== undefined) {
          const n = codes[i + 2];
          curColor = `hsl(${(n * 47) % 360}, 88%, 68%)`;
          i += 2;
        } else if (c === 38 && codes[i + 1] === 2 && codes[i + 4] !== undefined) {
          curColor = `rgb(${codes[i + 2]},${codes[i + 3]},${codes[i + 4]})`;
          i += 4;
        }
      }
      lastIdx = match.index + match[0].length;
    }
    if (lastIdx < rawSegment.length) {
      pushHighlightedChunk(rawSegment.slice(lastIdx), curColor);
    }
    return spans.length ? spans : [{ text: rawSegment, color: baseColor, hot: false }];
  }

  function rebuildLineView(entry) {
    const viewExpanded = redactSensitiveText(entry.origExpanded);
    const viewPlain = viewExpanded.replace(/\x1b\[[0-9;]*[A-Za-z]/g, "");
    entry.viewRaw = viewPlain;
    entry.viewLower = viewPlain.toLowerCase();
    entry.spans = tokenizeSpans(viewExpanded, entry.baseColor);
  }

  function formatTime(isoOrNow) {
    const d = isoOrNow ? new Date(isoOrNow) : new Date();
    if (Number.isNaN(d.getTime())) return new Date().toTimeString().slice(0, 8);
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    const ss = String(d.getSeconds()).padStart(2, "0");
    return `${hh}:${mm}:${ss}`;
  }

  function appendOrUpdateLine(rawLine, isoTime, replaceLast, silentBackfill = false) {
    const boundedRaw = rawLine.length > MAX_LINE_CHARS
      ? rawLine.slice(0, MAX_LINE_CHARS) + " … [truncated]"
      : rawLine;
    const origExpanded = boundedRaw.replace(/\t/g, "  ");
    const origPlain = origExpanded.replace(/\x1b\[[0-9;]*[A-Za-z]/g, "");
    if (!origPlain.trim() && replaceLast) return;

    const sem = classifySemanticLine(origPlain, !silentBackfill);
    const now = performance.now();
    const entry = {
      id: ++state.lineCounter,
      ts: silentBackfill ? now - 2000 : now,
      timeStr: formatTime(isoTime),
      origExpanded,
      viewRaw: "",
      viewLower: "",
      spans: [],
      baseColor: sem.color,
      kind: sem.kind,
      energy: sem.energy,
    };
    rebuildLineView(entry);

    if (replaceLast && state.lines.length > 0) {
      const prevKind = state.lines[state.lines.length - 1].kind;
      entry.ts = now - 110;
      state.lines[state.lines.length - 1] = entry;
      if (prevKind !== entry.kind) recomputeErrorCount();
    } else {
      state.lines.push(entry);
      if (entry.kind === "error") state.errorCount++;
      if (!silentBackfill) {
        state.linesThisSec++;
        const impulse = (state.viewMode === "CASCADE" || state.viewMode === "DRUM")
          ? state.fontSize * 3.45
          : state.fontSize * 1.38;
        state.smoothScrollPx = Math.min(280, state.smoothScrollPx + impulse);
        state.newestLineMs = now;
      }
      if (state.lines.length > MAX_LINES) {
        const dropped = state.lines.splice(0, state.lines.length - MAX_LINES);
        for (const d of dropped) {
          if (d.kind === "error") state.errorCount = Math.max(0, state.errorCount - 1);
        }
      }
    }

    state.linesVersion++;
    state.textDirty = true;
    if (entry.kind === "error") {
      btnErrJump.textContent = `ERR: ${state.errorCount}`;
      btnErrJump.classList.toggle("err-active", state.errorCount > 0);
    }

    if (!silentBackfill) {
      feedSignalAnalyzer(entry.viewRaw, sem.energy, sem.kind);
    }
  }

  function ingestLogChunk(text, isoTime, silentBackfill = false) {
    if (typeof text !== "string" || !text.length) return;
    const norm = text.replace(/\r\n/g, "\n");
    const newlineParts = norm.split("\n");

    for (let i = 0; i < newlineParts.length; i++) {
      const part = newlineParts[i];
      const isTrailingEmptyAfterLf = (i === newlineParts.length - 1 && part === "");
      if (isTrailingEmptyAfterLf) {
        state.partialCrActive = false;
        continue;
      }

      if (part.includes("\r")) {
        const crSegments = part.split("\r");
        for (let c = 0; c < crSegments.length; c++) {
          const seg = crSegments[c];
          if (seg === "" && c === 0) {
            state.partialCrActive = true;
            continue;
          }
          if (!seg) continue;
          const shouldReplace = state.partialCrActive || c > 0;
          appendOrUpdateLine(seg, isoTime, shouldReplace, silentBackfill);
          state.partialCrActive = true;
        }
      } else {
        appendOrUpdateLine(part, isoTime, state.partialCrActive, silentBackfill);
        state.partialCrActive = false;
      }

      if (i < newlineParts.length - 1) {
        state.partialCrActive = false;
      }
    }
  }

  function connectComfySocket() {

      if (typeof ev.data !== "string") return;
      let msg;
      try {
        msg = JSON.parse(ev.data);
      } catch (_) {
        return;
      }
      const { type, data } = msg;
      if (type === "logs" && Array.isArray(data?.entries)) {
        for (const entry of data.entries) {
          if (entry && typeof entry.m === "string") {

      } else if (type === "executing") {
        const nodeId = data?.node;
        if (nodeId === null || nodeId === undefined) {
          if (state.runState === "BLASTING") {
            state.runState = "COMPLETE";
            state.lastElapsedSec = (performance.now() - state.runStartMs) / 1000;
            state.activeNodeTitle = "Workflow Complete";
            state.flashPulse = 1.0;
            triggerShockwave(0.5, 0.5);
            playSynthTick("complete", 1.0);
          }
        } else {
          state.runState = "BLASTING";
          if (!state.runStartMs) state.runStartMs = performance.now();
          state.activeNodeId = String(nodeId);
          const knownTitle = state.nodeTitleMap.get(String(nodeId));
          state.activeNodeTitle = knownTitle ? `${knownTitle} (#${nodeId})` : `Node #${nodeId}`;
          state.nodePulse = 1.0;
          state.stepVal = 0;
          state.stepMax = 0;
          triggerShockwave(0.2 + Math.random() * 0.6, 0.35 + Math.random() * 0.3);
          playSynthTick("shock", 0.8);
          if (!state.logStreamAvailable) {
            ingestLogChunk(`[ComfyUI] Executing ${state.activeNodeTitle}\n`);
          }
        }
        state.textDirty = true;
      } else if (type === "progress") {
        const now = performance.now();
        if (state.lastStepMs > 0 && data?.value > state.stepVal) {
          const dt = (now - state.lastStepMs) / 1000;
          if (dt > 0.005 && dt < 30) {
            const instRate = (data.value - state.stepVal) / dt;
            state.stepRateSmooth = state.stepRateSmooth > 0
              ? state.stepRateSmooth * 0.7 + instRate * 0.3
              : instRate;
          }
        }
        state.lastStepMs = now;
        state.stepVal = Number(data?.value || 0);
        state.stepMax = Number(data?.max || 0);
        state.stepPulse = 1.0;
        state.runState = "BLASTING";
        state.textDirty = true;
      } else if (type === "execution_error") {
        state.runState = "ERROR";
        state.glitchBurst = 1.0;
        const errNode = data?.node_type || data?.node_id || "unknown";
        const errMsg = data?.exception_message || "Execution error";
        ingestLogChunk(`[ERROR] Node ${errNode}: ${errMsg}\n`);
      } else if (type === "execution_success") {
        state.runState = "COMPLETE";
        if (state.runStartMs) {
          state.lastElapsedSec = (performance.now() - state.runStartMs) / 1000;
        }
        state.flashPulse = 1.0;
        triggerShockwave(0.5, 0.5);
        state.textDirty = true;
      }
    });

    ws.addEventListener("close", () => {
      state.wsConnected = false;
      state.textDirty = true;
      scheduleWsReconnect();
    });

    ws.addEventListener("error", () => {
      try { ws.close(); } catch (_) {}
    });
  }

          ? sysData.devices

        const dev = devs.find((d) => d && String(d.type || "").toLowerCase() !== "cpu") || devs[0] || null;
        if (dev) {

            ? Math.round(rawTotal / (1024 * 1024))

          const freeMib = Number.isFinite(rawFree) && rawFree >= 0
            ? Math.round(rawFree / (1024 * 1024))
            : 0;
          const cleanName = String(dev.name || dev.type || "Compute Device")
            .replace(/^(?:cuda|mps|xpu|hip|cpu)(?::\d+)?\s+/i, "")
            .replace(/\s*:.*$/, "")
            .trim() || "Compute Device";
          state.gpuTelemetry = {
            ok: true,
            available: totalMib > 0,
            metrics_mode: "vram_only",
            gpu_name: cleanName,
            gpu_util: 0,
            vram_used_mib: Math.max(0, totalMib - freeMib),
            vram_total_mib: totalMib,
            temp_c: 0,
            power_w: 0,
          };
          state.textDirty = true;
        }
      }
    } catch (_) {}
  }
